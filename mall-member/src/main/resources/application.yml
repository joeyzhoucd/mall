server:
  port: 11000
spring:
  application:
    name: mall-member
  # 从 Config Server 拉配置。用 spring.config.import 而不是旧的 bootstrap.yml——
  # Boot 2.4 起这就是官方推荐的方式（Config Data API），不需要 bootstrap 上下文。
  #
  # optional: 前缀很关键：Config Server 没起来时服务照常启动（用本地配置兜底），
  # 不加的话 Helm chart 里没有任何启动顺序编排，10 个服务会一起 crashloop 直到
  # mall-config 就绪。代价是"配置中心在但返回空内容"这种情况会静默地退回本地默认值，
  # 所以别把只存在于 Config Server 里的关键配置设计成没有本地兜底。
  #
  # 地址直接用 K8s 的 Service DNS，不走服务发现——配置中心是启动阶段就要用的东西，
  # 再加一层"先查注册中心"只是多一个启动顺序依赖，而 Service 名本身就是稳定入口。
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  datasource:
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    url: jdbc:mysql://${MYSQL_HOST:192.168.77.100}:${MYSQL_PORT:3306}/mall_ums?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 这里原来有一整段 Redis 连接配置。删掉了：mall-member 的 classpath 上【没有任何
  # Redis 相关依赖】（jar 里没有 spring-boot-data-redis / spring-data-redis / lettuce），
  # 代码里也完全没有用到 RedisTemplate / 缓存 / Session。那段配置从原项目复制过来之后
  # 一直是死的，只是看起来像在配 Redis。
  # 这是 ConfigMetadataTest 第一次运行就抓出来的：属性名 spring.data.redis.* 本身是对的，
  # 但在这个模块的 classpath 上没有任何依赖定义它，所以判定为 UNKNOWN。
  # 也就是说这个检查同时能发现两类问题：属性名写错了，以及属性名没错但这个模块用不上它。
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

