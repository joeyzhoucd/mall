server:
  port: 11000
spring:
  application:
    name: mall-member
  datasource:
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    url: jdbc:mysql://${MYSQL_HOST:192.168.77.100}:${MYSQL_PORT:3306}/mall_ums?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${REDIS_HOST:192.168.77.100}
    port: ${REDIS_PORT:6379}
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

feign:
  client:
    config:
      default:
        connectTimeout: 5000  # 
        readTimeout: 5000     # 
        loggerLevel: full     # basicheadersfull 
  httpclient:
    enabled: true          #  Apache HttpClient 
    max-connections: 200  # 
    max-connections-per-route: 50  # 
