server:
  port: 8000
spring:
  datasource:
    username: root
    password: root
    url: jdbc:mysql://192.168.77.100:3306/mall_pms
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.77.101:8848
  main:
    allow-circular-references: false
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

feign:
  client:
    config:
      default:
        connectTimeout: 5000  # 连接超时时间（毫秒）
        readTimeout: 5000     # 读取超时时间（毫秒）
        loggerLevel: full     # 日志级别（basic、headers、full 等）
  httpclient:
    enabled: true          # 启用 Apache HttpClient 替代默认客户端
    max-connections: 200  # 最大连接数
    max-connections-per-route: 50  # 每个路由的最大连接数