server:
  # 8080 是原来 renren-fast 用的端口，沿用它是为了少改一处（Helm values、网关路由都按这个走）。
  port: 8080
spring:
  application:
    name: mall-admin
  # 从 Config Server 拉配置。optional: 前缀是必须的——chart 里没有启动顺序编排，
  # 不加的话 Config Server 没就绪时这个服务会 crashloop。
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  datasource:
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    # 【不要写回 useSSL=false】实测过：这个参数是生效的（等价 sslMode=DISABLED），
    # 而服务端本来就支持 TLS 1.3 —— 主库和从库都是 have_ssl=YES、tls_version=TLSv1.2,TLSv1.3、
    # 带自签服务端证书。也就是说那行参数主动关掉了一个免费的加密，
    # 让凭据和每一行数据在集群内明文传输。
    #
    # 顺带解决一个常见的 MySQL 8 隐患：caching_sha2_password 在服务端认证缓存为空时
    # 需要客户端取 RSA 公钥，而驱动默认 allowPublicKeyRetrieval=false 会拒绝。
    # 正确解法【不是】把它打开 —— 那会保持明文、还允许在未加密信道上取公钥，
    # 正是驱动那个默认值要防的中间人攻击。走 TLS 之后密码可以安全传输，压根不需要取公钥。
    #
    # 为什么是 REQUIRED 不是 PREFERRED：PREFERRED 在服务端不支持 TLS 时会【静默退回明文】，
    # 那正是这个项目反复踩的那类「配了等于没配」。REQUIRED 连不上就明确失败。
    # 留 MYSQL_SSL_MODE 这个口子是给上云用的：阿里云 RDS / AWS RDS 的证书链不同，
    # 真遇到问题时改环境变量即可，不用重新构建镜像。
    # 更进一步是 VERIFY_CA / VERIFY_IDENTITY（校验证书），那需要把 CA 分发到各服务，
    # 是另一件事，还没做。
    url: jdbc:mysql://${MYSQL_HOST:192.168.77.100}:${MYSQL_PORT:3306}/mall_admin?useUnicode=true&characterEncoding=UTF-8&sslMode=${MYSQL_SSL_MODE:REQUIRED}&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池。原来一个字都没配，走 Hikari 默认：pool=10、connection-timeout=30s。
    # pool=10 保持不变（瓶颈在 MySQL 侧：单 pod、cpu=1、max_connections=151，
    # 6 个连库服务 × 10 = 60，滚动更新双份时 120，已经逼近上限）。
    # 改的是等待时间：30 秒 -> 3 秒。
    #
    # 为什么现在必须显式配：开了虚拟线程之后，Tomcat 那 200 个线程构成的准入闸门
    # 消失了，请求会一路涌到连接池排队。默认 30 秒意味着过载时几千个请求各等 30 秒
    # 再一起失败 —— 比不开虚拟线程还差。3 秒是主动降级：快速失败、把队列压住，
    # 并且刻意小于上游 Feign 的 read-timeout(5000)，让失败在本服务暴露成
    # 「拿不到连接」而不是上游一个语焉不详的读超时。
    #
    # minimum-idle = maximum-pool-size 是固定大小池（HikariCP 官方建议）：
    # 动态伸缩省下几个空闲连接，代价是流量上来时要在请求路径上现建连接。
    #
    # 可调的那一份在 mall-deploy 的 config-repo/application.yml（优先级更高）；
    # 这里是拉不到配置中心时的兜底。
    # 不放 mall-common-default.properties：另外 5 个服务没有 jdbc starter，
    # 那些属性在它们的 classpath 上无效（ConfigMetadataTest 会拦）。
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 3000
      max-lifetime: 1800000
      keepalive-time: 300000
  # 请求/响应编码。注意前缀是 spring.servlet.encoding.*，不是 server.servlet.encoding.*
  # （后者从 Boot 3.0 起就不再绑定了，写了完全不生效——mall-order 踩过，中文直接乱码）。
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # ---------- 定时任务（Quartz）----------
  quartz:
    job-store-type: jdbc
    # 【必须是 never】。QRTZ_* 那 11 张表【已经存在】—— 它们是旧 renren 后台留下的，
    # 里面还有历史触发状态（QRTZ_SCHEDULER_STATE 2 行、QRTZ_TRIGGERS 1 行，
    # schedule_job_log 有 244 条日志，最后一条是 2026-08-25 testTask 的执行记录）。
    # 设成 always 会在每次启动时重建表结构 —— 那会把这些历史一起清掉；
    # 设成 embedded 更糟，直接切成内存存储，重启就丢任务、多副本还会各跑一份。
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceName: MallAdminScheduler
      # AUTO = 用主机名+时间戳生成实例 id。集群模式下每个实例必须不同，
      # 写死一个值会让两个副本互相认为对方是"自己的旧实例"并去接管彼此的任务。
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      # 【集群模式】mall-admin 现在只有 1 个副本，但这个开关必须现在就打开：
      # 关着的话 Quartz 假设自己是唯一实例，扩到 2 副本时【同一个任务会被触发两次】。
      # 而那种问题在单副本环境里永远测不出来，等扩容才发现，且表现为"任务莫名跑了两遍"。
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 15000
      # 超过 cron 时间点才被触发算"错过"。默认策略会把错过的都补跑一遍 ——
      # 一次滚动更新（pod 重启 20 多秒）之后，所有分钟级任务会一起补跑，
      # 形成一个尖峰。withMisfireHandlingInstructionDoNothing 是在 ScheduleUtils
      # 里按触发器设的，这里只调阈值。
      org.quartz.jobStore.misfireThreshold: 60000
      org.quartz.threadPool.class: org.quartz.simpl.SimpleThreadPool
      # 20 个足够：这里的任务是"到点调一个 bean 方法"，不是计算密集型。
      # 调大反而会让多个慢任务同时压数据库。
      org.quartz.threadPool.threadCount: 20
      org.quartz.threadPool.threadPriority: 5
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

mall:
  admin:
    jwt:
      # JWT 签名密钥。必须从环境变量注入，且长度 >= 32 字节（HS256 的要求）。
      # 生产环境走 Sealed Secret（sealed-secrets/local/admin-jwt.yaml 里那份还在，
      # 阶段 1 删模块时刻意没删，就是为了重建时直接复用）。
      # 这里的默认值只为本地能跑起来，一眼就能看出不是真密钥。
      secret: ${JWT_SECRET:local-dev-only-do-not-use-in-any-real-environment}
      # 令牌有效期。JWT 是无状态的，登出没法立刻让令牌失效，所以不宜设太长。
      # 想要"登出即失效"需要额外做一个 Redis 黑名单，当前没做。
      expire-seconds: ${JWT_EXPIRE_SECONDS:43200}
    captcha:
      # 验证码有效期。存在服务端内存里，多副本下会出现"在 A 实例取的码到 B 实例校验不到"，
      # 所以 replicaCount>1 时必须改成放 Redis。当前单副本，先用内存实现并把这个限制写清楚。
      expire-seconds: 300
