# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000
      min-spare: 30
    connection-timeout: 5000ms
  port: 8080
  servlet:
    context-path: /admin

spring:
  #  dev|test|prod
  profiles:
    active: dev
  # jackson
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true

  mvc:
    throw-exception-if-no-handler-found: true
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  application:
    name: mall-admin
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.77.101:8848
#  resources:
#    add-mappings: false


#mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  #package
  typeAliasesPackage: io.renren.modules.*.entity
  global-config:
    #
    db-config:
      #  AUTO:"ID", INPUT:"ID", ID_WORKER:"ID (ID)", UUID:"ID UUID";
      id-type: AUTO
      logic-delete-value: -1
      logic-not-delete-value: 0
    banner: false
  #
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'


renren:
  redis:
    open: false
  shiro:
    redis: false
  # APPjwtAPP
  jwt:
    # 
    secret: REDACTED-JWT-SECRET
    # token7
    expire: 604800
    header: token
