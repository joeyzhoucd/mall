server:
  port: 10000
spring:
  # 开启虚拟线程：每个 HTTP 请求跑在自己的虚拟线程上，阻塞时从载体线程卸载。
  # 秒杀链路里有两处不可避免的阻塞 —— 等 RabbitMQ 的 publisher confirm（最多 3 秒）
  # 和查收货地址的 Feign 调用（超时 5 秒）。在平台线程模型下这两处会占住 Tomcat
  # 那 200 个线程中的一个，所以之前不得不用「异步 servlet + 有界线程池 + TaskDecorator」
  # 三层机制绕开；开了虚拟线程之后这三层全部删掉了（见 CouponWebConfig 的注释）。
  #
  # 一个必须知道的前提：本项目跑在 Java 21，虚拟线程在 synchronized 块里阻塞时
  # 会【钉住】载体线程（JDK 24 的 JEP 491 才解决）。数据库驱动、Redis 客户端这类
  # 库内部是否存在这种情况，静态看代码判断不了，要用运行时手段：
  #   java -Djdk.tracePinnedThreads=short -jar app.jar
  # 一旦发生 pinning 就会打出栈。压测时务必看一眼，别默认它一定没问题。
  #
  # 【这一条现在在 mall-common-default.properties 里也是全局默认了，这里仍然显式保留】
  # 不是冗余：其他服务开虚拟线程是「顺手的优化」，关掉只是退回线程池模型；
  # 而 mall-coupon 是【代码依赖】它 —— CouponWebConfig 里那套异步 servlet + 有界线程池
  # + TaskDecorator 已经因为有了虚拟线程而删掉了。全局默认哪天被改成 false，
  # 别的服务只是变慢，这个服务会退回到「阻塞占满 Tomcat 线程」的老问题上。
  # 所以这里的 true 是本服务的硬要求，不跟随全局。
  threads:
    virtual:
      enabled: true
  # 【排除 Redisson 的自动配置，让 Lettuce 接管 Spring Data Redis】
  #
  # 起因：秒杀链路的 Tempo 链路里【一个 Redis span 都没有】，而同集群的 mall-auth
  # 有（它的登录链路能看到 hmset / pexpireat / exists 三条命令）。差别就在这里 ——
  # mall-auth 没引 redisson，走的是 Lettuce。
  #
  # 根因：redisson-spring-boot-starter 的 RedissonAutoConfigurationV4 提供了
  # redissonConnectionFactory，它成了唯一的 RedisConnectionFactory，于是
  # StringRedisTemplate（包括秒杀的 Lua 脚本）全部走 Redisson，压根不经过 Lettuce。
  # Boot 的 LettuceObservationAutoConfiguration 条件全部通过、customizer 也真的
  # 创建了 —— 但它定制的那个 ClientResources 没有任何消费者。
  # 这是很典型的「配置匹配 != 配置生效」：条件报告说 matched 是实话，bean 确实在，
  # 只是没人用它。光看条件报告会得出「配置是对的」这个错误结论。
  #
  # 排除之后的分工回到常规做法：
  #   Spring Data Redis（RedisTemplate / Spring Session / 发布订阅）-> Lettuce
  #   Redisson 只保留它真正不可替代的部分 —— RLock 分布式锁
  # RedissonClient 由本模块的 RedissonConfig 自己创建，不依赖 starter，所以排除安全。
  #
  # 改之前逐条核实过的安全前提（这三条只要有一条不成立就会出事）：
  #   1. 全部代码注入的都是 StringRedisTemplate，它的序列化器恒为 StringRedisSerializer，
  #      与底层连接工厂无关 —— 所以换驱动不会让 Redis 里已有的明文数据读不出来。
  #      （如果哪天有人注入 RedisTemplate<Object,Object>，Boot 默认是 JDK 二进制序列化，
  #      换驱动就会造成新旧数据格式不一致，那时这个排除必须重新评估。）
  #   2. 没有任何代码使用 RedissonReactiveClient / RedissonRxClient（V4 一并提供）。
  #   3. RedissonAutoConfigurationV2 本来就不匹配（它要 Boot 3 的 RedisAutoConfiguration），
  #      所以只排 V4 就够，不会有另一个悄悄顶上。
  autoconfigure:
    exclude: org.redisson.spring.starter.RedissonAutoConfigurationV4
  application:
    name: mall-coupon
  # 从 Config Server 拉配置。用 spring.config.import 而不是旧的 bootstrap.yml——
  # Boot 2.4 起这就是官方推荐的方式（Config Data API），不需要 bootstrap 上下文。
  #
  # optional: 前缀很关键：Config Server 没起来时服务照常启动（用本地配置兜底），
  # 不加的话 Helm chart 里没有任何启动顺序编排，10 个服务会一起 crashloop 直到
  # mall-config 就绪。代价是"配置中心在但返回空内容"这种情况会静默地退回本地默认值，
  # 所以别把只存在于 Config Server 里的关键配置设计成没有本地兜底。
  #
  # 地址直接用 K8s 的 Service DNS，不走服务发现——配置中心是启动阶段就要用的东西，
  # 再加一层"先查注册中心"只是多一个启动顺序依赖，而 Service 名本身就是稳定入口。
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  datasource:
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    # 【不要写回 useSSL=false】实测过：这个参数是生效的（等价 sslMode=DISABLED），
    # 而服务端本来就支持 TLS 1.3 —— 主库和从库都是 have_ssl=YES、tls_version=TLSv1.2,TLSv1.3、
    # 带自签服务端证书。也就是说那行参数主动关掉了一个免费的加密，
    # 让凭据和每一行数据在集群内明文传输。
    #
    # 顺带解决一个常见的 MySQL 8 隐患：caching_sha2_password 在服务端认证缓存为空时
    # 需要客户端取 RSA 公钥，而驱动默认 allowPublicKeyRetrieval=false 会拒绝。
    # 正确解法【不是】把它打开 —— 那会保持明文、还允许在未加密信道上取公钥，
    # 正是驱动那个默认值要防的中间人攻击。走 TLS 之后密码可以安全传输，压根不需要取公钥。
    #
    # 为什么是 REQUIRED 不是 PREFERRED：PREFERRED 在服务端不支持 TLS 时会【静默退回明文】，
    # 那正是这个项目反复踩的那类「配了等于没配」。REQUIRED 连不上就明确失败。
    # 留 MYSQL_SSL_MODE 这个口子是给上云用的：阿里云 RDS / AWS RDS 的证书链不同，
    # 真遇到问题时改环境变量即可，不用重新构建镜像。
    # 更进一步是 VERIFY_CA / VERIFY_IDENTITY（校验证书），那需要把 CA 分发到各服务，
    # 是另一件事，还没做。
    url: jdbc:mysql://${MYSQL_HOST:192.168.77.100}:${MYSQL_PORT:3306}/mall_sms?useUnicode=true&characterEncoding=UTF-8&sslMode=${MYSQL_SSL_MODE:REQUIRED}&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池。原来一个字都没配，走 Hikari 默认：pool=10、connection-timeout=30s。
    # pool=10 保持不变（瓶颈在 MySQL 侧：单 pod、cpu=1、max_connections=151，
    # 6 个连库服务 × 10 = 60，滚动更新双份时 120，已经逼近上限）。
    # 改的是等待时间：30 秒 -> 3 秒。
    #
    # 为什么现在必须显式配：开了虚拟线程之后，Tomcat 那 200 个线程构成的准入闸门
    # 消失了，请求会一路涌到连接池排队。默认 30 秒意味着过载时几千个请求各等 30 秒
    # 再一起失败 —— 比不开虚拟线程还差。3 秒是主动降级：快速失败、把队列压住，
    # 并且刻意小于上游 Feign 的 read-timeout(5000)，让失败在本服务暴露成
    # 「拿不到连接」而不是上游一个语焉不详的读超时。
    #
    # minimum-idle = maximum-pool-size 是固定大小池（HikariCP 官方建议）：
    # 动态伸缩省下几个空闲连接，代价是流量上来时要在请求路径上现建连接。
    #
    # 可调的那一份在 mall-deploy 的 config-repo/application.yml（优先级更高）；
    # 这里是拉不到配置中心时的兜底。
    # 不放 mall-common-default.properties：另外 5 个服务没有 jdbc starter，
    # 那些属性在它们的 classpath 上无效（ConfigMetadataTest 会拦）。
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 3000
      max-lifetime: 1800000
      keepalive-time: 300000
  # Redis 连接参数的属性前缀必须是 spring.data.redis.*，不能写 spring.redis.*。
  # 后者从 Boot 3.0 起就【不再绑定】了（元数据里标的是 deprecation level=error，
  # 留着只为了让迁移工具能提示你它没了），写了不报错、也没有警告，Boot 的
  # RedisConnectionFactory 会直接回落到 localhost:6379。
  # 这个坑比编译错误难查得多：pod 是绿的（默认 readiness 分组只看 readinessState，
  # 不含 redis 健康指示器），要等到真正读写 Session / 缓存 / 限流计数时才报连不上。
  data:
    redis:
      # 一主二从+哨兵：不再直连固定 host/port，改成把哨兵地址给客户端去问 master 是谁。
      # RedissonConfig 走的是另一条腿（Redisson 不是 Spring 的 RedisConnectionFactory），
      # 那边配的是同一份 REDIS_SENTINEL_MASTER/NODES，两边分开配、值一致。
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:mymaster}
        nodes: ${REDIS_SENTINEL_NODES:redis-sentinel-0.redis-sentinel:26379,redis-sentinel-1.redis-sentinel:26379,redis-sentinel-2.redis-sentinel:26379}
  thymeleaf:
    cache: false
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

mall:
  session:
    enabled: true
  mq:
    seckill:
      enabled: true
  # 秒杀 activate/order-created 这两个"内部调用"接口靠这个共享密钥挡住公网匿名请求
  # （它们走的 seckill.mall.com 网关路由没有其他鉴权）。mall-order 那边要配成一样的值
  # 才能调通 order-created 回调，见 mall-order/application.yml 里的同名配置。
  seckill:
    internal-token: ${SECKILL_INTERNAL_TOKEN:seckill-internal-secret}
