server:
  port: 10000
spring:
  application:
    name: mall-coupon
  datasource:
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    url: jdbc:mysql://${MYSQL_HOST:192.168.77.100}:${MYSQL_PORT:3306}/mall_sms?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${REDIS_HOST:192.168.77.100}
    port: ${REDIS_PORT:6379}
  thymeleaf:
    cache: false
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

mall:
  session:
    enabled: true
  mq:
    seckill:
      enabled: true
  # 秒杀 activate/order-created 这两个"内部调用"接口靠这个共享密钥挡住公网匿名请求
  # （它们走的 seckill.mall.com 网关路由没有其他鉴权）。mall-order 那边要配成一样的值
  # 才能调通 order-created 回调，见 mall-order/application.yml 里的同名配置。
  seckill:
    internal-token: ${SECKILL_INTERNAL_TOKEN:seckill-internal-secret}
