server:
  port: 10000
spring:
  application:
    name: mall-coupon
  # 从 Config Server 拉配置。用 spring.config.import 而不是旧的 bootstrap.yml——
  # Boot 2.4 起这就是官方推荐的方式（Config Data API），不需要 bootstrap 上下文。
  #
  # optional: 前缀很关键：Config Server 没起来时服务照常启动（用本地配置兜底），
  # 不加的话 Helm chart 里没有任何启动顺序编排，10 个服务会一起 crashloop 直到
  # mall-config 就绪。代价是"配置中心在但返回空内容"这种情况会静默地退回本地默认值，
  # 所以别把只存在于 Config Server 里的关键配置设计成没有本地兜底。
  #
  # 地址直接用 K8s 的 Service DNS，不走服务发现——配置中心是启动阶段就要用的东西，
  # 再加一层"先查注册中心"只是多一个启动顺序依赖，而 Service 名本身就是稳定入口。
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  datasource:
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    url: jdbc:mysql://${MYSQL_HOST:192.168.77.100}:${MYSQL_PORT:3306}/mall_sms?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${REDIS_HOST:192.168.77.100}
    port: ${REDIS_PORT:6379}
  thymeleaf:
    cache: false
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

mall:
  session:
    enabled: true
  mq:
    seckill:
      enabled: true
  # 秒杀 activate/order-created 这两个"内部调用"接口靠这个共享密钥挡住公网匿名请求
  # （它们走的 seckill.mall.com 网关路由没有其他鉴权）。mall-order 那边要配成一样的值
  # 才能调通 order-created 回调，见 mall-order/application.yml 里的同名配置。
  seckill:
    internal-token: ${SECKILL_INTERNAL_TOKEN:seckill-internal-secret}
