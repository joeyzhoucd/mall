server:
  port: 10000
spring:
  datasource:
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    url: jdbc:mysql://${MYSQL_HOST:192.168.77.100}:${MYSQL_PORT:3306}/mall_sms?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.77.101:8848}
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

feign:
  client:
    config:
      default:
        connectTimeout: 5000  # 
        readTimeout: 5000     # 
        loggerLevel: full     # basicheadersfull 
  httpclient:
    enabled: true          #  Apache HttpClient 
    max-connections: 200  # 
    max-connections-per-route: 50  # 
