server:
  port: 88
spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.77.101:8848}
    gateway:
      routes:
        - id: product_route
          uri: lb://mall-product
          predicates:
            - Path=/api/product/**
          filters:
            - RewritePath=/api/(?<segment>.*),/$\{segment}
        - id: member_route
          uri: lb://mall-member
          predicates:
            - Path=/api/member/**
          filters:
            - RewritePath=/api/(?<segment>.*),/$\{segment}
        - id: thirdparty_route
          uri: lb://mall-thirdparty
          predicates:
            - Path=/api/thirdparty/**
          filters:
            - RewritePath=/api/(?<segment>.*),/$\{segment}
        - id: ware_route
          uri: lb://mall-ware
          predicates:
            - Path=/api/ware/**
          filters:
            - RewritePath=/api/(?<segment>.*),/$\{segment}
        - id: admin_route
          uri: lb://mall-admin
          predicates:
            - Path=/api/**
          filters:
            - RewritePath=/api/(?<segment>.*),/admin/$\{segment}

        # mall-order 没有自己的域名，走结算/支付这条链路是从 cart.mall.com（购物车页
        # “去结算”）跳过来的，必须放在 mall_cart_route 之前，否则 Host=cart.mall.com
        # 那条纯 Host 匹配规则会先接住，把 /order/** 也转给 mall-cart（它没有这些接口）。
        - id: order_route
          uri: lb://mall-order
          predicates:
            - Path=/order/**
        - id: pay_mock_route
          uri: lb://mall-order
          predicates:
            - Path=/pay/**

        - id: mall_auth_route
          uri: lb://mall-auth
          predicates:
            - Host=auth.mall.com

        - id: mall_search_route
          uri: lb://mall-search
          predicates:
            - Host=search.mall.com

        - id: mall_cart_route
          uri: lb://mall-cart
          predicates:
            - Host=cart.mall.com

        - id: product_item_route
          uri: lb://mall-product
          predicates:
            - Host=item.mall.com

        - id: product_site_route
          uri: lb://mall-product
          predicates:
            - Host=**.mall.com
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
main:
  web-application-type: reactive
