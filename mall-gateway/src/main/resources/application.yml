server:
  port: 88
spring:
  # 网关不开虚拟线程，显式关掉。
  #
  # mall-common-default.properties 里把 spring.threads.virtual.enabled 设成了 true
  # （对所有服务生效），但网关是 WebFlux 响应式栈：并发是 Netty 事件循环 + Reactor
  # 调度器管的，不存在"一个请求占一个线程"这回事，虚拟线程在这里无从发挥。
  #
  # 更要紧的是它会改变【别的东西】：Boot 在这个开关打开时会把 applicationTaskExecutor
  # 和调度任务换成虚拟线程执行器。网关上任何 @Async / @Scheduled 都会跟着换实现，
  # 而这不是我们想在这里改的东西 —— 响应式栈里本来就禁止阻塞，改执行器不解决任何问题，
  # 只是多一个和主链路无关的变量。
  #
  # 所以这里写 false 不是"以防万一"，是让这个决定显式可见：
  # 不写的话，将来有人看网关的行为会以为它和其他服务一样开了虚拟线程。
  threads:
    virtual:
      enabled: false
  # 这一段原来写在文件【根级别】（顶格的 main:），也就是 main.web-application-type——
  # Spring 压根没有这个属性，等于完全没配。正确的是 spring.main.web-application-type。
  # 之所以一直没出问题：mall-gateway 的 pom 把 mall-common 带来的
  # spring-boot-starter-web 排掉了，classpath 上只有 WebFlux，Boot 自动就判定成
  # reactive。所以这是个隐性错误——哪天有人去掉那个 exclusion，网关会以 servlet
  # 模式启动、路由全部失效，而这行配置看起来明明写着 reactive。
  main:
    web-application-type: reactive
  application:
    name: mall-gateway
  # 从 Config Server 拉配置。用 spring.config.import 而不是旧的 bootstrap.yml——
  # Boot 2.4 起这就是官方推荐的方式（Config Data API），不需要 bootstrap 上下文。
  #
  # optional: 前缀很关键：Config Server 没起来时服务照常启动（用本地配置兜底），
  # 不加的话 Helm chart 里没有任何启动顺序编排，10 个服务会一起 crashloop 直到
  # mall-config 就绪。代价是"配置中心在但返回空内容"这种情况会静默地退回本地默认值，
  # 所以别把只存在于 Config Server 里的关键配置设计成没有本地兜底。
  #
  # 地址直接用 K8s 的 Service DNS，不走服务发现——配置中心是启动阶段就要用的东西，
  # 再加一层"先查注册中心"只是多一个启动顺序依赖，而 Service 名本身就是稳定入口。
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  # Redis 连接参数的属性前缀必须是 spring.data.redis.*，不能写 spring.redis.*。
  # 后者从 Boot 3.0 起就【不再绑定】了（元数据里标的是 deprecation level=error，
  # 留着只为了让迁移工具能提示你它没了），写了不报错、也没有警告，Boot 的
  # RedisConnectionFactory 会直接回落到 localhost:6379。
  # 这个坑比编译错误难查得多：pod 是绿的（默认 readiness 分组只看 readinessState，
  # 不含 redis 健康指示器），要等到真正读写 Session / 缓存 / 限流计数时才报连不上。
  data:
    redis:
      # 只给 RequestRateLimiter 限流用，跟其他服务复用同一个 Redis 实例，不是单独一份数据。
      # 一主二从+哨兵上线后不再直连固定 host/port（master 会随故障转移变化），
      # 改成把 3 个哨兵地址都给客户端，由它自己去问哨兵"现在谁是 master"。
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:mymaster}
        nodes: ${REDIS_SENTINEL_NODES:redis-sentinel-0.redis-sentinel:26379,redis-sentinel-1.redis-sentinel:26379,redis-sentinel-2.redis-sentinel:26379}
  cloud:
    gateway:
      # 路由配置的属性前缀是 spring.cloud.gateway.server.webflux.routes，
      # 不是老的 spring.cloud.gateway.routes。Spring Cloud 2025.x 把网关拆成了
      # server-webflux / server-webmvc / proxyexchange 几个变体（依赖也从
      # spring-cloud-starter-gateway 改名成 spring-cloud-starter-gateway-server-webflux），
      # 配置前缀跟着一起加了 server.webflux 这两层。
      #
      # 这是这次迁移里后果最严重的一个静默失效：旧前缀在新版元数据里【完全不存在】
      # （连 deprecated 记录都没留），写了不报错、不告警，网关正常启动、
      # /actuator/health 是 UP、pod 是 Ready——但它一条路由都没有，
      # 所有 /api/** 请求全部 404。前端整站等于挂了，而每一层监控都显示绿色。
      server:
        webflux:
          routes:
            - id: product_route
              uri: lb://mall-product
              predicates:
                - Path=/api/product/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            - id: member_route
              uri: lb://mall-member
              predicates:
                - Path=/api/member/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            - id: thirdparty_route
              uri: lb://mall-thirdparty
              predicates:
                - Path=/api/thirdparty/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            - id: ware_route
              uri: lb://mall-ware
              predicates:
                - Path=/api/ware/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}
            # 后台管理（阶段 7 用 Spring Security 重建的 mall-admin）。
            #
            # 和旧实现的关键区别：旧的是 Path=/api/** 的【兜底规则】，把前面几条没匹配上的
            # /api 流量全部吃掉转给 renren-fast。现在改成【精确前缀】/api/sys/**。
            # 原因是兜底规则会掩盖"某个前缀忘配路由"这类问题：请求不会 404 在网关，
            # 而是被转给一个根本没有这些接口的服务，然后由它回 404 —— 现象一样、原因完全不同，
            # 排查时会往错的方向找。实际就踩到了：/api/coupon/** 一直没有路由（见下一条），
            # 后台的 SKU 优惠设置页因此不可用，但因为有兜底规则，看起来只是"接口 404"。
            - id: admin_route
              uri: lb://mall-admin
              predicates:
                - Path=/api/sys/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}

            # 验证码是根路径下的单个文件名，不在 /sys 下面（前端写死了 /captcha.jpg?uuid=xxx），
            # 所以要单独一条。它必须匿名可访问，mall-admin 的 SecurityConfig 里也放开了。
            - id: admin_captcha_route
              uri: lb://mall-admin
              predicates:
                - Path=/api/captcha.jpg
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}

            # 优惠券服务。这条路由【原本是缺失的】—— 前端后台的 SKU 编辑页会调
            # /api/coupon/coupon/list、/api/coupon/skuladder/save 等一批接口，但网关里从来没有
            # 对应规则。以前被 /api/** 兜底规则接走转给了 renren-fast，得到 404，
            # 看起来像"接口不存在"而不是"路由没配"。补上。
            #
            # 注意：即使补了路由，其中一部分接口在 mall-coupon 里仍然不存在（只有 /placeholder
            # 占位桩）。那是原项目遗留的未完成功能，属于另一件事，不在阶段 7 范围内。
            - id: coupon_route
              uri: lb://mall-coupon
              predicates:
                - Path=/api/coupon/**
              filters:
                - RewritePath=/api/(?<segment>.*),/$\{segment}

            # 还差一个 /api/seckill/**：前端会调 /api/seckill/scheduler/save，但后端【压根没有
            # 这个接口】（已全仓库确认，mall-coupon 里的秒杀接口在 coupon/seckill 和
            # coupon/seckillpromotion 下面）。所以这里刻意不加路由 —— 加一条指向不存在接口的
            # 路由只是把 404 从网关挪到服务，不解决任何问题。
            # 正确的做法是让前端改调已有接口，或者在 mall-coupon 里补上这个端点，另开一件事做。

            # mall-order 没有自己的域名，走结算/支付这条链路是从 cart.mall.com（购物车页
            # “去结算”）跳过来的，必须放在 mall_cart_route 之前，否则 Host=cart.mall.com
            # 那条纯 Host 匹配规则会先接住，把 /order/** 也转给 mall-cart（它没有这些接口）。
            - id: order_route
              uri: lb://mall-order
              predicates:
                - Path=/order/**
            - id: pay_mock_route
              uri: lb://mall-order
              predicates:
                - Path=/pay/**

            - id: mall_auth_route
              uri: lb://mall-auth
              predicates:
                - Host=auth.mall.com

            - id: mall_search_route
              uri: lb://mall-search
              predicates:
                - Host=search.mall.com

            - id: mall_cart_route
              uri: lb://mall-cart
              predicates:
                - Host=cart.mall.com

            - id: product_item_route
              uri: lb://mall-product
              predicates:
                - Host=item.mall.com

            # 秒杀这条路由单独加限流：真正要防的是"总请求量把 mall-coupon/Redis/数据库冲垮"，
            # 不是防某个人刷（秒杀本来就是海量不同用户同时各发一两个请求，按用户/IP 限流
            # 挡不住这种"人多但单个请求量不大"的合法流量），所以用一个全局 key（见
            # RateLimiterConfig.seckillGlobalKeyResolver）——所有请求共用同一个令牌桶。
            #
            # ------------------------------------------------------------------
            # 2026-08-27 压测校准结果（k6 在集群内施压，脚本见 mall-deploy/loadtest/）
            # ------------------------------------------------------------------
            # 限流器行为【精确正确】，多轮复现：30 秒窗口内放行量恒为
            #   replenishRate × 30 + burstCapacity = 50×30 + 100 = 1600
            # 300 rps 施压时放行 1518，600 rps 施压时放行 1598。
            #
            # 各环节实测容量（都是 500m CPU 配额）：
            #   mall-gateway  约 200 rps 的【请求处理】能力（其中绝大部分是廉价的
            #                 429 拒绝），足以从容发出 50 rps 的放行额度；
            #   mall-coupon   150 rps 时 p95 = 5ms，285 rps 时 p95 涨到 1033ms。
            # 所以 50 这个值相对下游的框架层容量偏保守（约为 1/3）。
            #
            # 但【不要据此就把它调高】：上面 mall-coupon 的数字打的是一条不存在的
            # 路径（下游返回 404），只走到了 DispatcherServlet 和拦截器链，
            # 没有碰 Redis 分布式锁、没有扣库存、没有过 SeckillBulkhead、没有发 MQ。
            # 真实抢购路径必然显著更慢，那个数才是该用来定 replenishRate 的依据。
            # 要量它需要先灌秒杀数据（sms_seckill_promotion / _session /
            # _sku_relation 目前都是 0 行）和测试会员。在那之前 50 保持不变。
            #
            # 另外记一条容易掉进去的坑：校准初期我测出「500m 的网关连自己配的
            # 50 rps 都发不出来」（600 rps 施压只放行 828），差点据此去加 CPU。
            # 真实原因是当时链路采样率是 100% 而 Tempo 正在 OOM CrashLoop ——
            # 每个 span 导出都失败并重试，网关的 CPU 花在了导出失败上。
            # 采样率降到 10% 且 Tempo 修好之后，同样 500m 同样 600 rps 放行 1598。
            # 【观测系统会消耗它本该测量的容量】，压测时先确认它自己是健康的。
            #
            # 超过限流 Gateway 直接返回 429，不占用下游任何资源。
            - id: mall_seckill_route
              uri: lb://mall-coupon
              predicates:
                - Host=seckill.mall.com
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@seckillGlobalKeyResolver}"

            - id: product_site_route
              uri: lb://mall-product
              predicates:
                - Host=**.mall.com
logging:
  level:
    org.springframework.cloud.gateway: DEBUG

# ---------------------------------------------------------------------------
# 【网关必须把 actuator 端点收窄回最小集，不能跟着 mall-common 的默认走】
#
# mall-common-default.properties 里给所有服务开了诊断端点
# （env / configprops / beans / mappings / loggers / threaddump），
# 那对后端服务是安全的 —— 它们的 actuator 从集群外打不到。
#
# 但网关不一样：2026-09-01 实测确认，
#   curl -H "Host: mall.com" http://<ingress-ip>/actuator/prometheus
# 返回的是【网关自己的】actuator（响应里有 spring_cloud_gateway_routes_count），
# 而且 auth./cart./seckill./item./search.mall.com 这些域名【全都能打到】。
#
# 原因：Spring Boot 的 actuator 端点映射优先级高于 Gateway 的 RoutePredicateHandlerMapping，
# 所以 /actuator/** 被网关自己截胡，压根不会走路由转发。
# 好的一面是后端 actuator 因此穿不透；坏的一面是网关自己的全暴露在公网入口上。
#
# 所以这里显式收窄。如果哪天把 env 也开在网关上，等于把数据库密码、JWT 密钥、
# 全部内部地址挂到公网 —— 那是一次真正的泄露，不是理论风险。
#
# 【要彻底解决网关这一层，正确做法是】把 actuator 挪到独立的 management port
# （management.server.port），让 ingress 和 Gateway 路由都够不着它。
# 之所以这次没做：Spring Cloud Consul 的健康检查 URL 是按【注册的服务端口】拼的，
# 挪端口会让 12 个服务在 Consul 里全变 critical、网关整个路由不出去，
# 而这个后果只有在一轮 24 分钟 CI 之后才验证得了。留作单独一项来做。
management:
  endpoints:
    web:
      exposure:
        # 只留 K8s 探针、Consul 健康检查和 Prometheus 抓取真正需要的三个
        include: health,info,prometheus
