server:
  port: 9000
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
spring:
  application:
    name: mall-order
  datasource:
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    url: jdbc:mysql://${MYSQL_HOST:192.168.77.100}:${MYSQL_PORT:3306}/mall_oms?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${REDIS_HOST:192.168.77.100}
    port: ${REDIS_PORT:6379}
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

pay:
  mock:
    signKey: mall-pay-sign-key

mall:
  session:
    enabled: true
  mq:
    order:
      enabled: true
    seckill:
      enabled: true
  # 必须和 mall-coupon/application.yml 里的 mall.seckill.internal-token 保持一致，
  # 否则回调 mall-coupon 的 order-created 接口会被当成未授权请求拒绝。
  seckill:
    internal-token: ${SECKILL_INTERNAL_TOKEN:seckill-internal-secret}