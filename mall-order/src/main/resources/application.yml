server:
  port: 9000
spring:
  application:
    name: mall-order
  # 从 Config Server 拉配置。用 spring.config.import 而不是旧的 bootstrap.yml——
  # Boot 2.4 起这就是官方推荐的方式（Config Data API），不需要 bootstrap 上下文。
  #
  # optional: 前缀很关键：Config Server 没起来时服务照常启动（用本地配置兜底），
  # 不加的话 Helm chart 里没有任何启动顺序编排，10 个服务会一起 crashloop 直到
  # mall-config 就绪。代价是"配置中心在但返回空内容"这种情况会静默地退回本地默认值，
  # 所以别把只存在于 Config Server 里的关键配置设计成没有本地兜底。
  #
  # 地址直接用 K8s 的 Service DNS，不走服务发现——配置中心是启动阶段就要用的东西，
  # 再加一层"先查注册中心"只是多一个启动顺序依赖，而 Service 名本身就是稳定入口。
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  # 请求/响应编码。属性前缀从 server.servlet.encoding.* 改成了
  # spring.servlet.encoding.*（Boot 3.0 起，deprecation level=error）。
  # 同样是静默失效：写旧前缀不报错，但 force/charset 完全不生效，
  # 表单提交的中文会按容器默认编码解析，直接变乱码。
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  datasource:
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    url: jdbc:mysql://${MYSQL_HOST:192.168.77.100}:${MYSQL_PORT:3306}/mall_oms?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Redis 连接参数的属性前缀必须是 spring.data.redis.*，不能写 spring.redis.*。
  # 后者从 Boot 3.0 起就【不再绑定】了（元数据里标的是 deprecation level=error，
  # 留着只为了让迁移工具能提示你它没了），写了不报错、也没有警告，Boot 的
  # RedisConnectionFactory 会直接回落到 localhost:6379。
  # 这个坑比编译错误难查得多：pod 是绿的（默认 readiness 分组只看 readinessState，
  # 不含 redis 健康指示器），要等到真正读写 Session / 缓存 / 限流计数时才报连不上。
  data:
    redis:
      host: ${REDIS_HOST:192.168.77.100}
      port: ${REDIS_PORT:6379}
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

pay:
  mock:
    signKey: mall-pay-sign-key

mall:
  session:
    enabled: true
  mq:
    order:
      enabled: true
    seckill:
      enabled: true
  # 必须和 mall-coupon/application.yml 里的 mall.seckill.internal-token 保持一致，
  # 否则回调 mall-coupon 的 order-created 接口会被当成未授权请求拒绝。
  seckill:
    internal-token: ${SECKILL_INTERNAL_TOKEN:seckill-internal-secret}