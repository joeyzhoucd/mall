<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>配送方式</title>
    <link rel="stylesheet" th:href="@{/static/css/order/order.css}">
</head>
<body>
<div class="header">
    <div class="topbar">
        <div class="topbar-left">
            <a class="topbar-link" href="http://mall.com">商城首页</a>
            <a class="topbar-link" href="http://search.mall.com/list.html">全部商品</a>
        </div>
        <div class="topbar-right">
            <a class="topbar-link" th:href="@{/order/confirm.html}">返回确认页</a>
        </div>
    </div>
</div>

<div class="confirm-container">
    <h2>选择配送方式</h2>

    <div class="section">
        <h3>收货地址</h3>
        <div th:if="${confirmVo.address == null or #lists.isEmpty(confirmVo.address)}">暂无地址</div>
        <div th:if="${confirmVo.address != null and !#lists.isEmpty(confirmVo.address)}">
            <div class="address-item" th:each="addr,iter : ${confirmVo.address}">
                <strong th:text="${addr.name}"></strong>
                <span>[[${addr.phone}]]</span>
                <div class="muted">[[${addr.province}]] [[${addr.city}]] [[${addr.region}]] [[${addr.detailAddress}]]</div>
            </div>
        </div>
    </div>

    <div class="section">
        <h3>配送服务</h3>
        <div class="card">
            <div class="row">
                <div class="col">
                    <div class="card-title">京配-标准达</div>
                    <div class="muted">预计 2-3 天送达（工作日优先）</div>
                </div>
                <div class="col-right">
                    <span class="tag">默认</span>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="row">
                <div class="col">
                    <div class="card-title">京配-极速达</div>
                    <div class="muted">预计 1 天送达（可能加收运费）</div>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="row">
                <div class="col">
                    <div class="card-title">预约配送</div>
                    <div class="muted">选择送达日期与时间段</div>
                </div>
            </div>
        </div>
        <div class="muted">提示：此页面目前仅展示效果，实际下单以确认页选择为准。</div>
    </div>

    <div class="summary">
        <a class="btn secondary" th:href="@{/order/confirm.html}">返回确认页</a>
    </div>
</div>
</body>
</html>
