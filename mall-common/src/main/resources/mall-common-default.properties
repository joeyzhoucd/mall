# 所有服务共用的基础设施默认值，由 MallCommonEnvironmentPostProcessor 以最低优先级
# 注入，服务自己的 application.yml 写了同名 key 就能覆盖。
# 这里只放"各环境长得一样、改了要重启才生效"的东西，环境差异走环境变量占位符。

# ---------- Consul 服务发现（替代原来的 Nacos） ----------
spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}

# 必须开：Consul 服务端要按注册上来的地址回拨做健康检查，而 K8s 里 pod 的 hostname
# 在 Consul 那个 pod 里是解析不了的，只有 pod IP 才路由得通。不开的话所有实例都会
# 因为健康检查连不上而被标成 critical。
spring.cloud.consul.discovery.prefer-ip-address=true

# 必须开：Consul 默认 queryPassing=false，也就是服务发现会把健康检查失败的实例
# 一起返回给调用方。Nacos 的默认行为是只返回健康实例，为了保持迁移前后行为一致
# 这里显式开成 true，否则 Feign/网关会把流量打到已经挂掉的实例上。
spring.cloud.consul.discovery.query-passing=true

# 健康检查地址就用 actuator 的（mall-common 里统一带了 actuator 依赖）。
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s

# ---------- Feign ----------
# 这段原来在 7 个服务的 application.yml 里各写一份（内容完全相同），收敛到这里。
#
# 重要：配置前缀变了。旧的 feign.client.* / feign.httpclient.* 在新版 Spring Cloud
# OpenFeign（5.0.x）里已经不认了，正确前缀是 spring.cloud.openfeign.*——
# 已经反编译 FeignClientProperties / FeignHttpClientProperties 确认过。
# 这属于静默失效：写旧前缀不会报错，只是超时和日志级别全部回落到默认值，
# 迁移的时候很容易漏掉。
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000
# full = 打请求/响应的头和body。调试期这么设方便，真实生产环境要调成 basic，
# 否则会把请求体（可能含敏感信息）全量写进日志、而且量很大。
spring.cloud.openfeign.client.config.default.logger-level=full
# 连接池大小（对应 feign-hc5，见 mall-common/pom.xml 里的说明）
spring.cloud.openfeign.httpclient.max-connections=200
spring.cloud.openfeign.httpclient.max-connections-per-route=50

# ---------- Actuator ----------
# 只暴露需要的端点：health 给 Consul 和 K8s 探针用，prometheus 给指标采集，info 备用。
# 不要图省事写成 "*"，那会把 env/heapdump/threaddump 这类能读到敏感信息的端点也开出去。
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# ---------- 链路追踪（Micrometer Tracing + OpenTelemetry → Tempo） ----------
# 采样率 1.0 = 全采。生产环境不会这么配（成本太高），但这是学习/调试环境，
# 秒杀那条跨 mall-coupon → RabbitMQ → mall-order → mall-ware 的链路需要每条都能看到。
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
# 注意属性名：management.otlp.tracing.endpoint 也是 error 级废弃的（Boot 4 把 OTel
# 相关配置统一收到了 management.opentelemetry.* 下面），正确的是下面这个长名字。
# 这个坑套了两层：先是缺 spring-boot-starter-opentelemetry 导致自动配置压根没加载，
# 就算加载了，旧属性名一样绑不上。两层都不报错。
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}

# 让日志里带上 traceId/spanId，这样 Loki 里搜到一条日志能直接跳到对应的调用链。
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# 健康检查显示各组件明细。默认是 never，只回一个 {"status":"DOWN"}——这次排查
# mall-cart 就吃了这个亏：Consul 把它标成 critical，但 /actuator/health 只说 DOWN，
# 到底是 DB、Redis 还是 MQ 挂了一个字都不说，只能翻日志。
# 这里开 always 是安全的：actuator 端点只在 pod 端口上暴露，网关的路由只转发 /api/**，
# Ingress 也没有指向 actuator 的规则，集群外访问不到。
# （上云或者把 actuator 暴露出去的话，要改成 when-authorized 并配上鉴权。）
management.endpoint.health.show-details=always
