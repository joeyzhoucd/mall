# 所有服务共用的基础设施默认值，由 MallCommonEnvironmentPostProcessor 以最低优先级
# 注入，服务自己的 application.yml 写了同名 key 就能覆盖。
# 这里只放"各环境长得一样、改了要重启才生效"的东西，环境差异走环境变量占位符。

# ---------- Consul 服务发现（替代原来的 Nacos） ----------
spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}

# 必须开：Consul 服务端要按注册上来的地址回拨做健康检查，而 K8s 里 pod 的 hostname
# 在 Consul 那个 pod 里是解析不了的，只有 pod IP 才路由得通。不开的话所有实例都会
# 因为健康检查连不上而被标成 critical。
spring.cloud.consul.discovery.prefer-ip-address=true

# 必须开：Consul 默认 queryPassing=false，也就是服务发现会把健康检查失败的实例
# 一起返回给调用方。Nacos 的默认行为是只返回健康实例，为了保持迁移前后行为一致
# 这里显式开成 true，否则 Feign/网关会把流量打到已经挂掉的实例上。
spring.cloud.consul.discovery.query-passing=true

# 健康检查地址就用 actuator 的（mall-common 里统一带了 actuator 依赖）。
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s

# ---------- Feign ----------
# 这段原来在 7 个服务的 application.yml 里各写一份（内容完全相同），收敛到这里。
#
# 重要：配置前缀变了。旧的 feign.client.* / feign.httpclient.* 在新版 Spring Cloud
# OpenFeign（5.0.x）里已经不认了，正确前缀是 spring.cloud.openfeign.*——
# 已经反编译 FeignClientProperties / FeignHttpClientProperties 确认过。
# 这属于静默失效：写旧前缀不会报错，只是超时和日志级别全部回落到默认值，
# 迁移的时候很容易漏掉。
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000
# full = 打请求/响应的头和body。调试期这么设方便，真实生产环境要调成 basic，
# 否则会把请求体（可能含敏感信息）全量写进日志、而且量很大。
spring.cloud.openfeign.client.config.default.logger-level=full
# 连接池大小（对应 feign-hc5，见 mall-common/pom.xml 里的说明）
spring.cloud.openfeign.httpclient.max-connections=200
spring.cloud.openfeign.httpclient.max-connections-per-route=50

# ---------- Actuator ----------
# 只暴露需要的端点：health 给 Consul 和 K8s 探针用，prometheus 给指标采集，info 备用。
# 不要图省事写成 "*"，那会把 env/heapdump/threaddump 这类能读到敏感信息的端点也开出去。
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# ---------- 链路追踪（Micrometer Tracing + OpenTelemetry → Tempo） ----------
# 采样率 1.0 = 全采。生产环境不会这么配（成本太高），但这是学习/调试环境，
# 秒杀那条跨 mall-coupon → RabbitMQ → mall-order → mall-ware 的链路需要每条都能看到。
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
# 注意属性名：management.otlp.tracing.endpoint 也是 error 级废弃的（Boot 4 把 OTel
# 相关配置统一收到了 management.opentelemetry.* 下面），正确的是下面这个长名字。
# 这个坑套了两层：先是缺 spring-boot-starter-opentelemetry 导致自动配置压根没加载，
# 就算加载了，旧属性名一样绑不上。两层都不报错。
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}

# 让日志里带上 traceId/spanId，这样 Loki 里搜到一条日志能直接跳到对应的调用链。
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# 健康检查显示各组件明细。默认是 never，只回一个 {"status":"DOWN"}——这次排查
# mall-cart 就吃了这个亏：Consul 把它标成 critical，但 /actuator/health 只说 DOWN，
# 到底是 DB、Redis 还是 MQ 挂了一个字都不说，只能翻日志。
# 这里开 always 是安全的：actuator 端点只在 pod 端口上暴露，网关的路由只转发 /api/**，
# Ingress 也没有指向 actuator 的规则，集群外访问不到。
# （上云或者把 actuator 暴露出去的话，要改成 when-authorized 并配上鉴权。）
management.endpoint.health.show-details=always

# 实例 ID 必须带唯一标识。Spring Cloud Consul 默认的实例 ID 是
# "${spring.application.name}-${server.port}"，也就是同一个服务的【所有实例共用一个 ID】。
#
# 这在 K8s 上是个隐蔽而严重的 bug，实测踩到了：滚动更新时新 pod 先用这个 ID 注册
# （把旧的那条覆盖成自己的 IP），紧接着旧 pod 优雅关闭、按同一个 ID 执行注销——
# 把新 pod 刚写进去的注册一起删掉了。结果是 Consul 的服务目录【整个变空】，
# 而所有 pod 都是 1/1 Running、健康检查全过。表现出来就是 Feign 调用报
# "no instances available"，但看每个服务本身都完全正常。
#
# 同一个原因还让横向扩容彻底失效：replicaCount 调成 3，注册表里也永远只有 1 个实例，
# 后两个 pod 白跑。这条对"模拟真实高并发"是硬伤——压测时以为在打 3 个实例，
# 实际全部流量都落在同一个 pod 上。
#
# 用 HOSTNAME 而不是框架自带的 include-hostname-in-instance-id=true：
# 在 K8s 里 HOSTNAME 就是 pod 名，唯一、且在同一个 pod 重启后保持不变（StatefulSet）
# 或随新 pod 变化（Deployment），语义完全可推理；而那个开关取的是
# InetUtils 探测出来的主机名，在容器网络里不一定是我们想要的东西。
# 本地 IDE 里没有 HOSTNAME 时回落到 random.value，每次启动唯一，也不会撞。
spring.cloud.consul.discovery.instance-id=${spring.application.name}-${HOSTNAME:${random.value}}

# ---------- 关掉 OTLP 的指标和日志导出，只保留链路追踪 ----------
# spring-boot-starter-opentelemetry 会把 OTLP 的【三条】导出通道一起装上：
# traces、metrics、logs，而且 metrics 和 logs 的开关默认都是 true，默认端点是
# http://localhost:4318/**。这个项目只需要 traces 走 OTLP（发给 Tempo）：
#   - 指标走 Prometheus 主动抓取 /actuator/prometheus（见上面的 exposure.include）
#   - 日志走 Alloy 读容器 stdout 文件推给 Loki
# 不关掉的实际后果已经实测到了：每个服务每个发布周期都往 localhost:4318 发一次
# 注定失败的请求，并打印完整的 ConnectException 堆栈——
#   msg=Failed to publish metrics to OTLP receiver (context: url=http://localhost:4318/v1/metrics)
# pod 是 1/1 Running、功能也正常，纯粹是持续的噪声 + 无效的连接开销。
# 而且日志采集刚修好，这些堆栈会全量进 Loki，等于自己给自己造日志洪水。
#
# 注意属性名的两种风格在 Boot 4 里是有区别的：指标那条是
# management.<registry>.metrics.export.enabled（management.metrics.export.<registry>.enabled
# 已经是 error 级废弃），日志那条反过来是 management.logging.export.otlp.enabled
# （management.otlp.logging.export.enabled 才是废弃的那个）。不对称，只能查元数据确认。
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false

# ---------- 日期序列化格式 ----------
# 后台 UI 的列表直接展示这个字段，不做二次格式化，所以后端输出什么就显示什么。
# 不配的话 Jackson 输出 ISO-8601 带 Z 的 UTC 形式（2026-08-27T03:58:41.000Z），
# 界面上会变成一串带 T 和 Z 的原始字符串，而且时间比本地时间少 8 小时。
# 原来只有 mall-product 和 mall-ware 在各自的 yml 里配了，其余服务都没有 ——
# 放在这里让所有服务一致，也省得新服务再漏一次。
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai

# ---------- 虚拟线程 ----------
# 每个 HTTP 请求跑在自己的虚拟线程上，阻塞时从载体线程卸载。原来只有 mall-coupon 开了
# （秒杀链路要等 publisher confirm 和 Feign），这里铺到全部服务：这些服务全是 servlet 栈，
# 干的都是「查库 / 调下游 / 查 ES」这类阻塞 I/O，正是虚拟线程的适用场景。
#
# 【必须和下面的连接池配置一起看，单独开这一条会让情况变糟】
# 平台线程模型下，Tomcat 的 200 个线程本身就是一道准入闸门：第 201 个请求在 accept 队列里
# 等着，不会进到应用里。开了虚拟线程之后这道闸门没了，请求会一路涌到【真正的稀缺资源】
# 那里排队 —— 对这 6 个连库的服务来说就是 Hikari 连接池。
# 而 Hikari 的默认 connection-timeout 是 30 秒，也就是过载时几千个虚拟线程各等 30 秒
# 再一起失败，延迟比原来差一个数量级。虚拟线程本身没有错，错在把队列挪到了一个
# 「无界排队 + 超长超时」的地方。所以下面把连接池的等待时间显式压短。
#
# 【Java 21 上的 pinning 风险，不要当成已经没事】
# 虚拟线程在 synchronized 块里阻塞会【钉住】载体线程（JDK 24 的 JEP 491 才解决，
# 本项目跑在 21）。库内部有没有这种情况，静态看代码判断不了，只能用运行时诊断：
#   java -Djdk.tracePinnedThreads=short -cp ... <主类>
# 已在本机 Temurin 21.0.12.1 上用一段故意 synchronized 阻塞的代码验证过这个开关确实生效
# （会打出 reason:MONITOR 和栈）。压测时务必开一次看看，别默认它一定没问题。
#
# 网关（mall-gateway）是 WebFlux 响应式栈，不适用，在它自己的 application.yml 里显式关掉。
spring.threads.virtual.enabled=true

# ---------- 数据库连接池（Hikari）：【不放在这里】 ----------
# 一度把 hikari 的几个参数写在这个文件里，被 ConfigMetadataTest 拦下了：
# mall-search / mall-auth / mall-cart / mall-thirdparty / mall-gateway 的 classpath 上
# 没有 spring-boot-starter-jdbc，spring.datasource.hikari.* 在它们那里不是有效属性。
#
# 运行时不会报错（绑不上的属性会被静默忽略），所以这不是「会崩」的问题，而是
# 「给一个没有数据库的服务配数据库连接池」这件事本身讲不通 —— 它会让人误以为
# 那些服务也有一个池子在起作用。
#
# 这个文件的定位是「所有服务共有的基础设施接线」，连接池不属于这一类：
# 只有 6 个服务连库，而它们各自的 application.yml 里本来就写着 datasource 的
# url / username / password。池配置跟着 datasource 走，放同一个地方才说得通。
# 可调的那一份在 mall-deploy/charts/mall/files/config-repo/application.yml。
