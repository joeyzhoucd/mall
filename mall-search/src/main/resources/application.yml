server:
  port: 14000
spring:
  application:
    name: mall-search
  # 从 Config Server 拉配置。用 spring.config.import 而不是旧的 bootstrap.yml——
  # Boot 2.4 起这就是官方推荐的方式（Config Data API），不需要 bootstrap 上下文。
  #
  # 【2026-09-22 去掉了 optional: 前缀，这是本服务的试点】
  #
  # 原来写的是 optional:configserver:...，语义是「拉不到也照常启动」。
  # 当初那么写是为了避免 crashloop：Helm chart 里没有启动顺序编排，
  # Config Server 慢一点，十几个服务会一起起不来。
  #
  # 但它的代价在 2026-09-21 被实测到了：宿主机网络抖动后三个 worker 同时恢复，
  # 业务服务和 Config Server 在【同一秒】被重建，服务启动时它还没 ready，
  # 于是 8 个服务的新副本全部带着 jar 里的默认 hikari 参数跑起来，
  # 和老副本行为不一致——而且【没有任何报错】，只有 mall_config_info 的
  # source 标签能看出来。这类「静默地跑在错配置上」比 crashloop 难查得多：
  # crashloop 是响的，静默降级是哑的。
  #
  # 现在的做法是 mall-common-default.properties 里配了
  # spring.cloud.config.retry.*（约 130 秒退避重试），先重试再放弃。
  # 这样「Config Server 晚就绪几十秒」这种最常见的情况被重试覆盖掉，
  # 而真的长时间不可用时才失败——那时候 crashloop 是【正确的信号】。
  #
  # 重试预算必须小于 livenessProbe 的 300 秒（20s × 15 次，且没有 startupProbe），
  # 否则 pod 会在重试途中被杀，表现成反复重启而日志停在「正在连接 Config Server」。
  #
  # 地址直接用 K8s 的 Service DNS，不走服务发现——配置中心是启动阶段就要用的东西，
  # 再加一层"先查注册中心"只是多一个启动顺序依赖，而 Service 名本身就是稳定入口。
  config:
    import: configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  cloud:
    config:
      # =====================================================================
      # 【这组配置刻意【只】放在 mall-search，不放 mall-common】
      # =====================================================================
      # 因为 fail-fast 的作用域是全局的，而它有一个反直觉的行为：
      #
      #   **fail-fast=true 会压过 optional: 前缀。**
      #
      # 实测（ConfigServerRetryTest）：配了 optional:configserver: 的应用，
      # 只要 fail-fast=true，拉不到配置照样抛 ConfigClientFailFastException
      # 启动失败。也就是说把这两行写进 mall-common，会让【其余 11 个仍带
      # optional: 的服务】一起变成 fail-fast —— Config Server 慢几秒就全体
      # crashloop。那不是试点，是一次全局改动。
      #
      # 所以：先在 mall-search 上跑一段时间，确认重试窗口足够、
      # 没有意外的 crashloop，再逐个推广。
      #
      # 【retry 依赖 fail-fast】Spring Cloud Config 只在 fail-fast=true 时
      # 注册 RetryTemplate（见 ConfigClientRetryBootstrapper），
      # 所以这两者是绑定的，不能只要重试不要 fail-fast。
      #
      # 【重试预算必须小于探针预算】实测 mall-* 的 livenessProbe 是
      # periodSeconds=20 × failureThreshold=15 = 300 秒，而且没有 startupProbe，
      # 探测从容器启动就开始。下面这组约 130 秒（2s 起、×1.2 退避、封顶 10s、
      # 共 20 次），加上 Spring Boot 冷启动 30~60 秒，总计约 3 分钟，留有余量。
      # 改大这些数之前先回头看探针，否则 pod 会在重试途中被杀，
      # 表现成反复重启而日志停在「正在连接 Config Server」。
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 2000
        multiplier: 1.2
        max-interval: 10000
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
elasticsearch:
  host: ${ES_HOST:192.168.77.102}
  port: ${ES_PORT:9200}

# 向量化服务（TEI），语义搜索用。
#
# 【这是一个可降级依赖】拿不到向量就退回纯关键词检索，搜索仍然可用，
# 只是「电饭锅」搜不到「厨房电器」这类语义结果。所以这里的超时和熔断参数
# 是按「降级代价小」来定的 —— 每个值的理由写在 EmbeddingProperties 里，
# 改之前先读那段注释，不要凭感觉调大超时。
#
# 【要临时关掉语义搜索】把 enabled 设成 false，或者在 Config Server 里覆盖
# mall.search.embedding.enabled —— 比改代码或缩容 TEI 都快，
# 而且 mall.search.embedding.calls{result="disabled"} 会如实反映出来。
#
# 其余参数（连接/读超时、熔断窗口等）都有默认值，只在需要偏离时才写在这里。
mall:
  search:
    embedding:
      enabled: ${SEARCH_EMBEDDING_ENABLED:true}
      base-url: ${EMBEDDING_URI:http://embedding}
    # 关键词检索和向量检索怎么合并。
    #
    # score-sum（默认）：ES 原生 query + knn 单请求，两路分数相加。
    # rrf：应用层 Reciprocal Rank Fusion，只看排名不看分数，发三路 _msearch。
    #
    # 【默认选 score-sum 是量出来的】2026-09-21 在真实 14941 条商品上对照
    # 5 组查询（看 top8 里「品类+品牌都对」的条数）：
    #     窗口 50  -> score-sum 38/40, rrf 30/40
    #     窗口 200 -> score-sum 38/40, rrf 34/40
    #     窗口 500 -> score-sum 38/40, rrf 34/40
    # RRF 随窗口变大而改善但追不上，还要付出双倍数据传输。
    # 原因见 SearchFusionProperties 的类注释。
    #
    # 【那为什么留着开关】上面的结论依赖当前的数据特征——商品标题是模板生成的，
    # 品牌和品类都是精确词，BM25 在这种数据上几乎无敌。换成真实电商数据
    # （口语化、错别字、同义词）之后应该重新量一次，那时不用改代码。
    fusion:
      mode: ${SEARCH_FUSION_MODE:score-sum}
