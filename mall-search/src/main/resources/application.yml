server:
  port: 14000
spring:
  application:
    name: mall-search
  # 从 Config Server 拉配置。用 spring.config.import 而不是旧的 bootstrap.yml——
  # Boot 2.4 起这就是官方推荐的方式（Config Data API），不需要 bootstrap 上下文。
  #
  # 【拉不到配置时会重试并最终失败，不再静默降级】
  # 开关是 spring.cloud.config.fail-fast + retry，通过【环境变量】下发
  # （mall-deploy/charts/mall/values.yaml 的 env 段），对所有服务生效。
  # 【不要改成写在 properties 文件里】——那比 Config Data 的加载晚，不会生效，
  # 理由写在 mall-common-default.properties 的对应注释里。
  #
  # 地址直接用 K8s 的 Service DNS，不走服务发现——配置中心是启动阶段就要用的东西，
  # 再加一层"先查注册中心"只是多一个启动顺序依赖，而 Service 名本身就是稳定入口。
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
elasticsearch:
  host: ${ES_HOST:192.168.77.102}
  port: ${ES_PORT:9200}

# 向量化服务（TEI），语义搜索用。
#
# 【这是一个可降级依赖】拿不到向量就退回纯关键词检索，搜索仍然可用，
# 只是「电饭锅」搜不到「厨房电器」这类语义结果。所以这里的超时和熔断参数
# 是按「降级代价小」来定的 —— 每个值的理由写在 EmbeddingProperties 里，
# 改之前先读那段注释，不要凭感觉调大超时。
#
# 【要临时关掉语义搜索】把 enabled 设成 false，或者在 Config Server 里覆盖
# mall.search.embedding.enabled —— 比改代码或缩容 TEI 都快，
# 而且 mall.search.embedding.calls{result="disabled"} 会如实反映出来。
#
# 其余参数（连接/读超时、熔断窗口等）都有默认值，只在需要偏离时才写在这里。
mall:
  search:
    embedding:
      enabled: ${SEARCH_EMBEDDING_ENABLED:true}
      base-url: ${EMBEDDING_URI:http://embedding}
    # 关键词检索和向量检索怎么合并。
    #
    # score-sum（默认）：ES 原生 query + knn 单请求，两路分数相加。
    # rrf：应用层 Reciprocal Rank Fusion，只看排名不看分数，发三路 _msearch。
    #
    # 【默认选 score-sum 是量出来的】2026-09-21 在真实 14941 条商品上对照
    # 5 组查询（看 top8 里「品类+品牌都对」的条数）：
    #     窗口 50  -> score-sum 38/40, rrf 30/40
    #     窗口 200 -> score-sum 38/40, rrf 34/40
    #     窗口 500 -> score-sum 38/40, rrf 34/40
    # RRF 随窗口变大而改善但追不上，还要付出双倍数据传输。
    # 原因见 SearchFusionProperties 的类注释。
    #
    # 【那为什么留着开关】上面的结论依赖当前的数据特征——商品标题是模板生成的，
    # 品牌和品类都是精确词，BM25 在这种数据上几乎无敌。换成真实电商数据
    # （口语化、错别字、同义词）之后应该重新量一次，那时不用改代码。
    fusion:
      mode: ${SEARCH_FUSION_MODE:score-sum}
