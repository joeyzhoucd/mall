name: Build and push service images

# 这个仓库是 Gitee 镜像过来的(源头是 gitee.com/joeyzhoucd/mall.git),
# 目前只手动同步,还没接 hub-mirror-action 自动镜像 —— 所以这个 workflow
# 靠 push 到 master 触发(手动同步一次代码就会自动触发一次构建),
# 也保留 workflow_dispatch 方便手动点一下重新跑。
on:
  push:
    branches: [master]
    # 纯文档改动不触发构建。
    #
    # 【判定规则】看的是「本次推送改动的文件是否【全部】命中忽略列表」——
    # 一次提交同时改了文档和代码，照样正常构建，不会被跳过。
    #
    # 【为什么值得加】没有它的时候，改一行 README 会引发：
    # 24 分钟全量构建（含集成测试）+ update-deploy 把镜像 tag 改成新 commit
    # + ArgoCD 同步 + 12 个服务全部滚动重启。为一次文档改动做这一整套毫无意义。
    #
    # 【刻意不忽略 .github/**】workflow 自己改了必须能触发一次构建来验证它，
    # 否则改坏了要等到下次真实推送才发现。
    #
    # 【将来的坑，先记下来】如果以后给 master 加分支保护、把这个 workflow 设成
    # 必需的状态检查，paths-ignore 会让纯文档的 PR 永远等不到这个检查、卡住无法合并。
    # 那时不能靠 paths-ignore，要改成「workflow 总是运行、但用 job 级 if: 条件跳过实际步骤」。
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitattributes'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch: {}

# packages: write 是推镜像到 ghcr.io 必须的权限;GITHUB_TOKEN 是仓库自带的,
# 不用额外去生成 PAT、不用存 secret。
# 【并发组】新的 push 取消同一分支上还在跑的旧运行。
#
# 加这个是因为真出过事：2026-08-27 引入 CDS 训练运行时，训练运行因为一个失效的
# 配置属性而永不退出，构建就一直挂着。而没有并发组，后续三次推送各起了一个新运行 ——
# 于是【三个运行同时挂着】，最老的那个挂了 90 分钟还在占 runner。
# GitHub 的 job 默认超时是 6 小时，所以它们本来会一直占到 6 小时。
#
# 对这个仓库来说取消旧运行永远是对的：只有最新提交的镜像有意义，
# 旧提交的镜像构建出来也不会被部署（update-deploy 只写最新的 tag）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # 单元测试作为构建的前置门禁：测试不过就不构建镜像，也就不会推出一个坏 tag。
  #
  # 为什么要单独一个 job 而不是把 -DskipTests 从 Dockerfile 里去掉：
  # 构建矩阵有 13 个服务、每个都是独立的 docker build，去掉 skipTests 等于把同一批测试
  # 跑 13 遍。单独跑一次、通过后再并行构建，快且清晰。
  #
  # 注意：集成测试（打了 @Tag("integration") 的）默认被 surefire 排除，这里【没有】
  # 加 -Pintegration。那些测试目前还需要真实的 MySQL/Redis/RabbitMQ/Consul，
  # 集成测试在下面单独的 integration-test 作业里跑（Testcontainers 起真实中间件），
  # 并且 build 作业同时依赖两者 —— 集成测试挂了会挡住发布。
  # 现在跑的是不依赖外部环境的静态检查，其中最重要的是 ConfigMetadataTest ——
  # 它拿各模块自己 classpath 上的配置元数据校验配置文件，专门守住
  # 「属性名变了、写旧名字不报错但完全不生效」这一类静默失效
  # （本次 Boot 4 迁移因此踩了 5 个坑，包括网关整站 404 和链路追踪零 span）。
  # 算出这次改动【真正影响】哪些服务，只构建/只部署那些。
  #
  # 【为什么加】原来 build 是写死的 14 项矩阵，update-deploy 把 values.yaml 里
  # 一个 image.tag 推到新 commit —— 而 12 个服务全都引用它，于是改一个模块，
  # 整集群 12 个服务全部重新拉镜像、全部滚动。
  # 实测单节点单镜像：传输 5m42s + 排队 14 分钟（一个节点同时拉 8 个约 200MB 镜像）。
  #
  # 【影响面从真实的 pom 依赖算，不写映射表】
  # 逻辑在 .github/scripts/affected-services.sh（mvn -pl <改动模块> -amd）。
  # 放脚本而不是内嵌 YAML 是为了能在本地拿真实提交区间验证 ——
  # 内嵌只能靠推一次真实提交来试，而试错代价是一整轮构建。
  #
  # 【失败方向：宁可多构建，绝不少构建】
  # 漏判的后果是某个服务静默继续跑旧代码 —— 没有报错，且和"部署成功"一模一样。
  # 脚本对任何无法归类的改动一律返回全量，详见其文件头注释。
  #
  # 注意 test / integration-test 【仍然跑全量】，不受这里影响：
  # 它们守的正是跨模块回归（2026-09-07 那次失败就是改别的模块、
  # 却挂在 mall-admin 的 OpenApiContractTest 上）。缩小它们的范围等于自废武功。
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      services: ${{ steps.affected.outputs.services }}
      count: ${{ steps.affected.outputs.count }}
    steps:
      - name: Checkout
        # 需要历史才能 diff 两个 commit。取全量比算"要多深"可靠，这个仓库也不大。
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compute affected services
        id: affected
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发拿不到有意义的 before，而且手动触发的意图通常就是"全部重建一次"。
            LIST=$(bash .github/scripts/affected-services.sh --all)
          else
            LIST=$(bash .github/scripts/affected-services.sh "${{ github.event.before }}" "${{ github.sha }}")
          fi
          echo "受影响的服务:"
          echo "$LIST" | sed 's/^/  /'
          COUNT=$(echo "$LIST" | grep -c . || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          # 矩阵要 JSON 数组。空数组会让 build 报错，所以下面的 job 用 count 做 if 条件。
          #
          # 用 jq -R -n '[inputs]' 逐行读，而不是 -s 'split(...)' ——
          # 后者的表达式里要写换行转义，而这份 YAML 经过 shell 时转义不可靠
          # （这一行第一版就是这么写坏的：转义被吃掉，jq 表达式里出现了真换行，
          #  整个 workflow YAML 解析失败）。逐行读不需要任何转义。
          echo "services=$(echo "$LIST" | jq -R -n -c '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    # 超时必须显式写。GitHub 的默认是【6 小时】，对这个仓库毫无意义 ——
    # 一次正常的单元测试是分钟级，卡住 20 分钟就说明出问题了，早失败早知道。
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 用 package 而不是 test：package 会跑测试【并且】产出 jar，下一步的 fat jar 校验
      # 需要 jar 在。一次 Maven 调用比 test + package 两次快得多（第二次要重新解析整个 reactor）。
      - name: Run unit tests and package
        run: mvn -B package

      # 校验每个可部署模块都产出了可执行 fat jar。逻辑放在独立脚本里而不是内嵌到 YAML：
      # 内嵌 shell 要同时应付 YAML 的块标量和 shell 的引号转义，很容易写坏（实际写坏过一次），
      # 而且脚本单独存在还能在本地直接跑。
      - name: Verify deployable modules produced fat jars
        run: bash .github/scripts/verify-fat-jars.sh

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7

  # 集成测试单独一个作业，和 test 并行。
  #
  # 为什么不塞进 test 作业里：这里要拉 MySQL / Redis / RabbitMQ / Elasticsearch 四个镜像
  # 并逐个模块起 Spring 上下文，是分钟级的；而 test 作业是秒级的静态检查。
  # 合在一起的话，一个纯配置笔误也要等几分钟才知道结果。并行跑两边都快。
  #
  # build 同时依赖这两个作业 —— 也就是说集成测试是【会挡住发布的】。
  # 这是有意的：这些测试验证的是「服务能不能连上依赖并把上下文拼起来」，
  # 挂了就说明镜像发出去也起不来，没有理由放行。
  integration-test:
    runs-on: ubuntu-latest
    # 比 test 作业宽松：要拉四个中间件镜像 + 起 11 个 Spring 上下文。
    # 但也不能太宽松 —— Testcontainers 连不上 Docker 时会重试到超时。
    #
    # 【为什么从 30 提到 45】30 分钟原本是"足够正常跑完"，但实测不是：
    # #99/#100/#101/#102 四次运行都稳定在 23 分钟左右（而且和改了多少模块无关），
    # 只剩 6 分钟余量 —— runner 慢一点就是一次和代码毫无关系的红。
    #
    # 同一个提交里加了容器复用（见下面那两步），预期会大幅低于 23 分钟。
    # 但超时是【安全网】，不该按乐观预期收紧：先留出余量，等复用的实测数字
    # 稳定几轮之后再往回收，而不是反过来。
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -Dgroups=integration 让 surefire【只】跑打了 integration 标签的，
      # 单元测试已经在 test 作业里跑过了，这里再跑一遍纯属浪费。
      # -Pintegration 负责把根 pom 里默认的 <excludedGroups>integration</excludedGroups> 清空，
      # 两个都要 —— 只加 -Dgroups 的话仍然会被 excludedGroups 排除掉，
      # 结果是「一个测试都没跑」而 Maven 照常 BUILD SUCCESS。
      # ------------------------------------------------------------------
      # 打开 Testcontainers 的容器复用
      # ------------------------------------------------------------------
      # Spring 的上下文缓存只在【同一个模块内】有效：Maven 给每个模块起一个独立的
      # surefire fork，进程一换，缓存和容器一起没了。于是 11 个模块各起一套
      # MySQL/Redis/RabbitMQ —— 这就是这个作业稳定跑 23 分钟的原因，
      # 而且和改了多少代码完全无关（#99/#100/#101/#102 都是 23 分钟）。
      #
      # withReuse(true)（见 Containers.java）让容器在 JVM 退出后继续活着，
      # 下一个模块的 fork 按容器配置的哈希命中同一个容器、直接连上去。
      #
      # 【但 withReuse 单靠代码不生效】它要求机器上有这个属性文件。
      # 没有的时候【不报错，只是完全不生效】—— 又一个"配了但没生效"，
      # 表现是作业悄悄地慢回 23 分钟，没有任何提示。所以下一步要断言它生效了。
      #
      # runner 是一次性的，容器留着不清理没有代价（Ryuk 也不会去回收
      # 标了复用的容器，这是 Testcontainers 有意的行为，不是泄漏）。
      - name: Enable Testcontainers container reuse
        run: |
          echo 'testcontainers.reuse.enable=true' >> ~/.testcontainers.properties
          echo "~/.testcontainers.properties:"
          cat ~/.testcontainers.properties | sed 's/^/  /'

      # ------------------------------------------------------------------
      # 显式预拉中间件镜像 —— 目的是【把拉取时间从 mvn 那一步里摘出来单独计时】
      # ------------------------------------------------------------------
      # 这一步不改变总耗时（镜像早晚都要拉），改变的是【能不能看见它花了多久】。
      #
      # 为什么需要看见：2026-09-10 加了容器复用之后，这个作业还是 23 分钟，
      # 和加之前一模一样。当时的解释是"11 个模块各起一套容器"，
      # 而复用断言明确显示复用生效了 —— 也就是说那个解释【是错的】，
      # 时间花在别处。在没有这个拆解之前，任何进一步的优化都是在猜。
      #
      # 拆成三段：这一步（拉镜像）+ mvn（测试执行 + Maven 开销）
      # + 下面的 breakdown（从 surefire 报告里加总纯测试时间）。
      # mvn 墙钟 - 纯测试时间 = Maven 自身开销（reactor 解析 / 编译 / 上下文启动）。
      - name: Pre-pull middleware images (timed separately)
        run: |
          # 版本必须和 mall-test-support 的 TestImages 完全一致，否则这里拉的是
          # 另一个 tag、Testcontainers 还是要自己再拉一遍 —— 那样这一步的读数
          # 变成"多拉了一次"，比没有还糟。
          # 【刻意不预拉 testcontainers/ryuk】它的 tag 跟着 Testcontainers 库的版本走，
          # 在这里写死一个版本号迟早对不上，而对不上的表现是这一步打一行"拉取失败" ——
          # 一个纯属误导的读数。ryuk 很小（十几 MB），漏掉它不影响结论。
          IMAGES="mysql:8.0.29 redis:7-alpine rabbitmq:3.12-management-alpine elasticsearch:8.11.1"
          for img in $IMAGES; do
            s=$(date +%s)
            docker pull -q "$img" >/dev/null 2>&1 || echo "  !! $img 拉取失败（Testcontainers 会自己重试，不让这一步挡住测试）"
            echo "  $img  $(( $(date +%s) - s ))s"
          done
          echo ""
          echo "镜像大小："
          docker images --format '  {{.Repository}}:{{.Tag}}  {{.Size}}' | grep -E "mysql|redis|rabbitmq|elasticsearch|ryuk" || true

      - name: Run integration tests (Testcontainers)
        # -fae（--fail-at-end）：一次看到所有失败的模块，而不是在第一个就停。
        # 失败仍然会让这一步非零退出、作业失败，只是诊断信息更全。
        #
        # 输出同时落一份文件，给下一步做复用的阳性对照用。
        # 【必须靠 pipefail 保住退出码】管道的退出码默认是最后一条命令（tee）的，
        # 不加的话 mvn 失败会被 tee 的成功盖掉 —— 集成测试挂了而作业绿。
        # GitHub 的 run 默认是 `bash -e {0}`，没有 pipefail，所以显式加。
        #
        # 【结束时间必须无论成败都记下来】直接把 `date > mvn-end` 写在 mvn 后面是错的：
        # mvn 失败时 `bash -e` 当场中断，这一行不会执行，而失败那一次恰恰最想看
        # 时间分布（是卡在拉镜像、还是卡在某个模块的上下文起不来）。
        # 所以显式接住退出码、记完时间再按原退出码退出。
        run: |
          set -o pipefail
          date +%s > /tmp/mvn-start
          rc=0
          mvn -B test -Pintegration -Dgroups=integration -fae 2>&1 | tee /tmp/integration.log || rc=$?
          date +%s > /tmp/mvn-end
          exit $rc

      # 断言容器复用【真的生效了】。
      #
      # 没有这一步的话，复用失效是完全静默的（属性文件路径写错、Testcontainers
      # 换了属性名、某次重构把 withReuse 删了）—— 作业照样绿，只是又变回 23 分钟。
      # 而"CI 慢了几分钟"这种信号没人会去追。
      #
      # 命中复用时 Testcontainers 会打 "Reusing container with ID"。
      # 第一个模块必然是创建而不是复用，所以门槛是"至少出现一次"。
      #
      # 【为什么 continue-on-error】复用失效不是正确性问题：最坏就是退回 23 分钟，
      # 而现在超时是 45 分钟，容得下。拿它挡住镜像发布就是个假门禁 ——
      # 一个和代码正确性无关的退化不该让部署停下来。
      # 但也不能只打 ::warning::，那种没人看。
      # continue-on-error 两头都要到了：这一步在 UI 里是红的、::error:: 注解也在，
      # 而 build 照常继续。
      - name: Assert container reuse actually took effect
        continue-on-error: true
        if: always()
        run: |
          hits=$(grep -c "Reusing container" /tmp/integration.log || true)
          created=$(grep -cE "Creating container for image" /tmp/integration.log || true)
          echo "命中容器复用: $hits 次"
          echo "新建容器:     $created 次"
          echo ""
          # 【"至少一次"这个门槛太松，不足以说明复用真的在省时间】
          # 2026-09-10 那轮：断言 success（确实有 Reusing container），
          # 而作业时长 23 分钟、和加复用之前一模一样。
          # 也就是说"有命中"和"省到了时间"是两件事，门槛只能说明前者。
          # 所以这里把两个数都打出来：11 个模块理想情况下
          # 新建 ≈ 3-4 个（每种配置一次）、复用 ≈ 20+ 次。
          # 如果 created 和模块数同量级，说明大部分容器仍在重复创建。
          echo "各种容器分别创建了几次（看是不是某一种一直没复用）："
          grep -oE "Creating container for image: [^ ]+" /tmp/integration.log 2>/dev/null \
            | sed 's/.*image: //' | sort | uniq -c | sed 's/^/  /' || true
          echo ""
          if [ "$hits" -lt 1 ]; then
            echo "::error::日志里没有一次 «Reusing container» —— 容器复用没生效（这不会让测试失败，只会让这个作业慢回 23 分钟）。检查 ~/.testcontainers.properties 那一步和 Containers.java 里的 withReuse(true)"
            exit 1
          fi

      # ------------------------------------------------------------------
      # 时间去哪了 —— 三段拆解
      # ------------------------------------------------------------------
      # 加这一步的直接原因：容器复用生效了，而作业时长一点没变（23 分钟）。
      # 那说明我对耗时来源的判断是错的，而"错的判断"会一直指挥错的优化。
      #
      # surefire 报告里每个测试类都有 "Time elapsed: N s"，加总得到【纯测试时间】。
      # mvn 那一步的墙钟减掉它，剩下的就是 Maven 自身开销：
      # reactor 解析、18 个模块的编译/测试编译、以及【被算进测试时间之外的】
      # 容器启动等待（Testcontainers 起容器发生在 @BeforeAll/上下文初始化里，
      # 不同版本记不记进 elapsed 不一定，所以这两段要一起看，别单看一个数）。
      - name: Where did the time go
        if: always()
        continue-on-error: true
        run: |
          s=$(cat /tmp/mvn-start 2>/dev/null || echo 0)
          e=$(cat /tmp/mvn-end 2>/dev/null || echo 0)
          wall=0
          if [ "$s" != "0" ] && [ "$e" != "0" ]; then wall=$(( e - s )); fi

          echo "===================== 时间拆解 ====================="
          echo "mvn 这一步的墙钟:  ${wall}s"
          echo ""
          echo "各模块的测试耗时（surefire 报告里的 Time elapsed，降序）："
          # 文件名形如 target/surefire-reports/com.mall.product.MallProductApplicationTests.txt
          # 模块名从路径第一段取，比类名可靠（类名里的模块段不总是和目录同名）。
          find . -path '*/surefire-reports/*.txt' 2>/dev/null | while read -r f; do
            mod=$(echo "$f" | sed -E 's|^\./([^/]+)/.*|\1|')
            cls=$(basename "$f" .txt | sed 's/.*\.//')
            t=$(grep -m1 -oE "Time elapsed: [0-9.]+" "$f" 2>/dev/null | sed 's/Time elapsed: //')
            [ -n "$t" ] && printf "%8.1f  %s  %s\n" "$t" "$mod" "$cls"
          done | sort -rn | head -25 | sed 's/^/  /'

          total=$(find . -path '*/surefire-reports/*.txt' 2>/dev/null -exec grep -m1 -oE "Time elapsed: [0-9.]+" {} \; \
                  | sed 's/Time elapsed: //' | awk '{s+=$1} END {printf "%.0f", s+0}')
          echo ""
          echo "纯测试时间合计:    ${total:-0}s"
          overhead=0
          if [ "$wall" -gt 0 ] && [ -n "$total" ]; then
            overhead=$(( wall - total ))
            echo "Maven 自身开销:    ${overhead}s  <- reactor 解析 + 18 个模块编译 + 容器启动等待"
            echo ""
            echo "（拉镜像不在这个数里 —— 它在上面 Pre-pull 那一步，单独计时）"
          fi
          echo "===================================================="

          # ----------------------------------------------------------------
          # 同一份数字再发一条 ::notice:: annotation
          # ----------------------------------------------------------------
          # 【为什么要重复一遍】作业日志要仓库 admin 权限才能通过 API 取
          # （实测 GET /actions/runs/{id}/logs 无鉴权是 403），
          # 而 check-runs 的 annotations 无鉴权就能读（实测 200）。
          # 也就是说上面那张表只有在 GitHub 界面上看得到；
          # 要让它能被脚本/外部读到，必须走 annotation 这条路。
          # 这和下面 "Surface test failures as annotations" 那一步是同一个理由。
          #
          # annotation 是单行的，换行要用 %0A 转义。
          top3=$(find . -path '*/surefire-reports/*.txt' 2>/dev/null | while read -r f; do
                   mod=$(echo "$f" | sed -E 's|^\./([^/]+)/.*|\1|')
                   t=$(grep -m1 -oE "Time elapsed: [0-9.]+" "$f" 2>/dev/null | sed 's/Time elapsed: //')
                   [ -n "$t" ] && printf "%.0f %s\n" "$t" "$mod"
                 done | sort -rn | head -3 | awk '{printf "%s=%ss ", $2, $1}')
          reuse=$(grep -c "Reusing container" /tmp/integration.log 2>/dev/null || echo 0)
          created=$(grep -cE "Creating container for image" /tmp/integration.log 2>/dev/null || echo 0)
          echo "::notice title=集成测试耗时拆解::mvn墙钟=${wall}s%0A纯测试合计=${total:-0}s%0AMaven开销=${overhead}s%0A容器复用命中=${reuse} 新建=${created}%0A最慢三个模块: ${top3}%0A（拉镜像时间见 Pre-pull 那一步的步骤耗时）"

      # 断言【确实跑了】。上面那条命令如果因为标签/profile 配错而一个测试都没匹配上，
      # Maven 会安安静静地成功 —— 这正是这个项目已经踩过的坑
      # （surefire 2.12.4 认不出 JUnit 5，写多少测试都等于没写，而且 BUILD SUCCESS）。
      # 所以用报告数量做一次阳性对照：预期 11 个模块各有 1 个上下文测试。
      - name: Assert integration tests actually ran
        run: |
          n=$(find . -path '*/surefire-reports/*ApplicationTests.txt' | wc -l)
          echo "跑到的集成测试报告数: $n"
          if [ "$n" -lt 11 ]; then
            echo "::error::期望至少 11 个集成测试报告，实际 $n —— 测试很可能被静默跳过了"
            exit 1
          fi

      # 把 surefire 的失败摘要打成 ::error:: 注解。
      #
      # 为什么需要这一步：作业日志和上传的产物都要仓库 admin 权限才能通过 API 取，
      # 而 check-run 的 annotations 是公开的。没有这一步，一次失败在外部能看到的
      # 只有一句「Process completed with exit code 1」—— 知道挂了但不知道哪挂了。
      #
      # 【提取什么很关键】第一版直接抓 "Caused by|Exception|Error creating bean"，
      # 结果注解被 Spring 的 WebMergedContextConfiguration 转储占满了 ——
      # 那一坨里有完整的 propertySourceProperties 列表，几百个字符，
      # 把真正的根因挤出了长度上限。所以这里：
      #   1. 先把那行配置转储过滤掉；
      #   2. 只取 "Caused by:" 链的【最后几条】—— 根因在链尾，不在链首。
      - name: Surface test failures as annotations
        if: failure()
        run: |
          for f in $(find . -path '*/surefire-reports/*.txt' 2>/dev/null); do
            if grep -qE "FAILURE!|<<< ERROR!" "$f"; then
              mod=$(echo "$f" | sed -E 's|^\./([^/]+)/.*|\1|')
              cls=$(basename "$f" .txt)
              stats=$(grep -m1 -E "Tests run:" "$f")
              # 过滤掉 Spring 的上下文配置转储（那行以 testClass = 开头的巨长内容）
              root=$(grep -E "Caused by:" "$f" | grep -v "MergedContextConfiguration" \
                     | tail -3 | tr '\n' ' ~ ' | cut -c1-600)
              # 没有 Caused by 时退回取第一条异常行
              if [ -z "$root" ]; then
                root=$(grep -m2 -E "^[A-Za-z0-9.]+(Exception|Error)" "$f" | tr '\n' ' ~ ' | cut -c1-600)
              fi
              echo "::error title=集成测试失败 $mod::$cls | $stats | 根因: $root"
            fi
          done
          n=$(find . -path '*/surefire-reports/*.txt' 2>/dev/null | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "::error::没有产出任何 surefire 报告 —— 失败发生在测试执行之前（依赖解析 / 编译 / 插件配置）"
          fi
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7


  build:
    needs: [plan, test, integration-test]
    # 受影响集合为空时（例如只改了文档而 paths-ignore 没拦住）不跑 ——
    # GitHub Actions 对空矩阵会直接报错，所以用 count 做条件而不是靠空数组。
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    # 一个矩阵项 = 一个服务的 docker build。正常大约 5-8 分钟（含 CDS 训练运行），
    # 25 分钟还没完就是卡住了 —— 卡住的典型原因是 CDS 训练运行没能退出
    # （见各服务 Dockerfile 里关于 mall.cds.training-exit 的注释）。
    # 没有这个超时的话默认要挂 6 小时，而且 fail-fast: false 意味着其余矩阵项
    # 会正常完成、只有卡住的那个吊着，最终 update-deploy 因为 needs: build 一直等 ——
    # 表现就是「CI 跑了很久没有任何产出」，完全不指向某一个服务。
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # 各服务独立构建,互不影响——某一个服务的 Dockerfile 写错了,
      # 不会挡住其他服务的构建。
      matrix:
        # 由 plan 作业算出，只含本次真正受影响的服务。
        # 原来这里是写死的 14 项 —— 那意味着改一行代码要构建并部署全部服务。
        service: ${{ fromJSON(needs.plan.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          # context 是整个仓库根目录(= mall-backend 本身),不是 matrix.service 那个子目录——
          # Dockerfile 里的 `mvn -pl <module> -am` 需要看到整个多模块 reactor(比如 mall-common
          # 这些被依赖的模块),只给子目录当 context 会编译不过。
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}-v2
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-v2

  # build 是矩阵 job，矩阵里的服务全部成功（任何一个失败，build 整体就是
  # failure）才会跑到这一步——不会出现"某个服务没构建成功，却把整个 tag 往前推"
  # 导致集群拉不到镜像的情况。mall-deploy 只在 Gitee 上，这个仓库的 CI 跑在
  # GitHub 上，两边够不着，所以用 GITEE_TOKEN 直接 git clone/push，不走
  # actions/checkout（它只认 GitHub 仓库）。
  update-deploy:
    needs: [plan, build]
    runs-on: ubuntu-latest
    # 只是 clone + 改 values.yaml + push，分钟级。
    timeout-minutes: 10
    steps:
      - name: Clone mall-deploy from Gitee
        run: git clone https://joeyzhoucd:${{ secrets.GITEE_TOKEN }}@gitee.com/joeyzhoucd/mall-deploy.git mall-deploy

      # 只写本次受影响的服务，其余保持原样 —— 不动的服务不会滚动。
      #
      # 【为什么不再动全局 image.tag】它是"全新安装时的回落值"。
      # 每次都推它等于让所有还没有 imageTags 覆盖的服务一起滚动，
      # 那正是这次要解决的问题。
      #
      # 【为什么用 yq 的 strenv 而不是字符串插值】
      # 服务名里有连字符（mall-product），yq 的路径表达式必须加引号才能取到那个 key；
      # 而 sha 用 strenv 传进去，避免 40 位十六进制被 yq 当成数字或表达式解析。
      - name: Bump per-service image tags
        env:
          SHA: ${{ github.sha }}
        run: |
          cd mall-deploy
          for svc in $(echo '${{ needs.plan.outputs.services }}' | jq -r '.[]'); do
            echo "  $svc -> $SHA"
            SVC="$svc" yq e '.imageTags[strenv(SVC)] = strenv(SHA)' -i charts/mall/values.yaml
          done
          echo "改动后的 imageTags:"
          yq e '.imageTags' charts/mall/values.yaml | sed 's/^/  /'

      # 写完立刻读回来比对。
      #
      # 【为什么值得单独一步】上面那条 yq 表达式（动态 key + strenv）
      # 在本地没法验证 —— 这台开发机没装 yq。而它写坏的后果不是"CI 失败"，
      # 是【把一份坏的 values.yaml 推给 ArgoCD 去应用】：
      # tag 写成空会渲染出 image: repo/svc:（pod 起不来），
      # key 写错会让那个服务悄悄停在旧镜像上 —— 后者完全静默。
      #
      # 读回比对把"表达式写错"从"部署事故"降级成"CI 红"。
      - name: Verify the tags were actually written
        env:
          SHA: ${{ github.sha }}
        run: |
          cd mall-deploy
          fail=0
          for svc in $(echo '${{ needs.plan.outputs.services }}' | jq -r '.[]'); do
            actual=$(SVC="$svc" yq e '.imageTags[strenv(SVC)]' charts/mall/values.yaml)
            if [ "$actual" != "$SHA" ]; then
              echo "写入校验失败: $svc 期望 $SHA，实际 '$actual'"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || { echo "values.yaml 没被正确改写，中止（不推送）"; exit 1; }
          echo "全部 $(echo '${{ needs.plan.outputs.services }}' | jq -r 'length') 个服务的 tag 校验通过"

      - name: Commit and push
        run: |
          cd mall-deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "tag 没变化，跳过提交"
            exit 0
          fi
          git add charts/mall/values.yaml
          SVCS=$(echo '${{ needs.plan.outputs.services }}' | jq -r 'join(" ")')
          git commit -m "chore: 镜像更新到 ${{ github.sha }} ($SVCS)"
          git push
