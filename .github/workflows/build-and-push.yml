name: Build and push service images

# 这个仓库是 Gitee 镜像过来的(源头是 gitee.com/joeyzhoucd/mall.git),
# 目前只手动同步,还没接 hub-mirror-action 自动镜像 —— 所以这个 workflow
# 靠 push 到 master 触发(手动同步一次代码就会自动触发一次构建),
# 也保留 workflow_dispatch 方便手动点一下重新跑。
on:
  push:
    branches: [master]
  workflow_dispatch: {}

# packages: write 是推镜像到 ghcr.io 必须的权限;GITHUB_TOKEN 是仓库自带的,
# 不用额外去生成 PAT、不用存 secret。
permissions:
  contents: read
  packages: write

jobs:
  # 单元测试作为构建的前置门禁：测试不过就不构建镜像，也就不会推出一个坏 tag。
  #
  # 为什么要单独一个 job 而不是把 -DskipTests 从 Dockerfile 里去掉：
  # 构建矩阵有 13 个服务、每个都是独立的 docker build，去掉 skipTests 等于把同一批测试
  # 跑 13 遍。单独跑一次、通过后再并行构建，快且清晰。
  #
  # 注意：集成测试（打了 @Tag("integration") 的）默认被 surefire 排除，这里【没有】
  # 加 -Pintegration。那些测试目前还需要真实的 MySQL/Redis/RabbitMQ/Consul，
  # 等改造成 Testcontainers 之后再在这里加一个 -Pintegration 的步骤。
  # 现在跑的是不依赖外部环境的静态检查，其中最重要的是 ConfigMetadataTest ——
  # 它拿各模块自己 classpath 上的配置元数据校验配置文件，专门守住
  # 「属性名变了、写旧名字不报错但完全不生效」这一类静默失效
  # （本次 Boot 4 迁移因此踩了 5 个坑，包括网关整站 404 和链路追踪零 span）。
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 用 package 而不是 test：package 会跑测试【并且】产出 jar，下一步的 fat jar 校验
      # 需要 jar 在。一次 Maven 调用比 test + package 两次快得多（第二次要重新解析整个 reactor）。
      - name: Run unit tests and package
        run: mvn -B package

      # 校验每个可部署模块都产出了可执行 fat jar。逻辑放在独立脚本里而不是内嵌到 YAML：
      # 内嵌 shell 要同时应付 YAML 的块标量和 shell 的引号转义，很容易写坏（实际写坏过一次），
      # 而且脚本单独存在还能在本地直接跑。
      - name: Verify deployable modules produced fat jars
        run: bash .github/scripts/verify-fat-jars.sh

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 各服务独立构建,互不影响——某一个服务的 Dockerfile 写错了,
      # 不会挡住其他服务的构建。
      matrix:
        service:
          # 配置中心要先起来（其他服务的 spring.config.import 指向它），
          # 但矩阵是并行的、构建顺序跟启动顺序无关，放第一个只是为了看着顺眼。
          - mall-config
          - mall-admin
          - mall-gateway
          - mall-auth
          - mall-member
          - mall-product
          - mall-cart
          - mall-order
          - mall-ware
          - mall-coupon
          - mall-search
          - mall-thirdparty
          - static-assets
          - elasticsearch-ik
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          # context 是整个仓库根目录(= mall-backend 本身),不是 matrix.service 那个子目录——
          # Dockerfile 里的 `mvn -pl <module> -am` 需要看到整个多模块 reactor(比如 mall-common
          # 这些被依赖的模块),只给子目录当 context 会编译不过。
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}-v2
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-v2

  # build 是矩阵 job，矩阵里的服务全部成功（任何一个失败，build 整体就是
  # failure）才会跑到这一步——不会出现"某个服务没构建成功，却把整个 tag 往前推"
  # 导致集群拉不到镜像的情况。mall-deploy 只在 Gitee 上，这个仓库的 CI 跑在
  # GitHub 上，两边够不着，所以用 GITEE_TOKEN 直接 git clone/push，不走
  # actions/checkout（它只认 GitHub 仓库）。
  update-deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Clone mall-deploy from Gitee
        run: git clone https://joeyzhoucd:${{ secrets.GITEE_TOKEN }}@gitee.com/joeyzhoucd/mall-deploy.git mall-deploy

      - name: Bump backend image tag
        run: yq e '.image.tag = "${{ github.sha }}"' -i mall-deploy/charts/mall/values.yaml

      - name: Commit and push
        run: |
          cd mall-deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "tag 没变化，跳过提交"
            exit 0
          fi
          git add charts/mall/values.yaml
          git commit -m "chore: 后端镜像自动更新到 ${{ github.sha }}"
          git push
