server:
  port: 13000
spring:
  application:
    name: mall-thirdparty
  # 从 Config Server 拉配置。用 spring.config.import 而不是旧的 bootstrap.yml——
  # Boot 2.4 起这就是官方推荐的方式（Config Data API），不需要 bootstrap 上下文。
  #
  # optional: 前缀很关键：Config Server 没起来时服务照常启动（用本地配置兜底），
  # 不加的话 Helm chart 里没有任何启动顺序编排，10 个服务会一起 crashloop 直到
  # mall-config 就绪。代价是"配置中心在但返回空内容"这种情况会静默地退回本地默认值，
  # 所以别把只存在于 Config Server 里的关键配置设计成没有本地兜底。
  #
  # 地址直接用 K8s 的 Service DNS，不走服务发现——配置中心是启动阶段就要用的东西，
  # 再加一层"先查注册中心"只是多一个启动顺序依赖，而 Service 名本身就是稳定入口。
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
# 对象存储。前缀从 aliyun.oss 改成 mall.storage —— 底下已经换成 S3 API，
# 名字再叫 aliyun 会让人以为还绑在阿里云上（部署到 MinIO 时尤其误导）。
mall:
  storage:
    # 【必须带 scheme】。老配置写的是裸域名 oss-cn-chengdu.aliyuncs.com，
    # 阿里云 SDK 接受那种写法，但 S3 SDK 要的是一个能被 URI.create 解析的地址，
    # 不带 https:// 会在建 Presigner 时抛 IllegalArgumentException。
    endpoint: ${OSS_ENDPOINT:https://oss-cn-chengdu.aliyuncs.com}
    # 参与 SigV4 签名。打非 AWS 端点时只要求签名两端一致，不要求是真实 AWS region。
    # 填错的表现是「签名不匹配」，不会说 region 有问题 —— 排查方向容易被带偏。
    region: ${OSS_REGION:oss-cn-chengdu}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    secret-access-key: ${OSS_ACCESS_KEY_SECRET}
    bucket: ${OSS_BUCKET_NAME:mall-cd}
    # 阿里云 OSS 的 S3 兼容端点用虚拟主机风格（bucket.endpoint），所以是 false。
    # 换 MinIO 或大多数自建服务时必须改成 true，它们只支持路径风格。
    path-style-access: ${OSS_PATH_STYLE:false}
    # 对外访问地址，通常是 CDN。留空则按 endpoint 和上面的风格拼。
    public-base-url: ${OSS_PUBLIC_BASE_URL:}