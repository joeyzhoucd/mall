server:
  port: 13000
spring:
  application:
    name: mall-thirdparty
feign:
  client:
    config:
      default:
        connectTimeout: 5000  # 
        readTimeout: 5000     # 
        loggerLevel: full     # basicheadersfull 
  httpclient:
    enabled: true          #  Apache HttpClient 
    max-connections: 200  # 
    max-connections-per-route: 50  # 
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-chengdu.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: ${OSS_BUCKET_NAME:mall-cd}
